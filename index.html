// Stage 2: VAMPIRE BAT - hovers, rains poop bombs, dive-bombs, calls bats at half HP
class BatBoss extends Boss {
    constructor(x) {
        super(x);
        this.name = 'VAMPIRE BAT';
        this.width = 90; this.height = 60;
        this.hp = 45; this.maxHp = 45;
        this.hoverY = 225;
        this.y = this.hoverY;
        this.noKnockback = true;
        this.flapTime = 0;
        this.summoned = false;
        this.vx = 0; this.vy = 0; this.dir = 1; this.rainT = 0;
    }

    contact(dmg) {
        if (this.hitDone || player.hurtTimer > 0) return;
        if (playerTouches(this.x + 10, this.x + this.width - 10, this.y - this.height + 10, this.y - 5)) {
            this.hitDone = true;
            hurtPlayer(dmg, this.x + this.width / 2);
        }
    }

    update() {
        if (this.tickDead()) return;
        if (this.flash > 0) this.flash--;
        this.flapTime += this.state === 'dive' ? 0.15 : 0.35;
        const cx = this.x + this.width / 2, cy = this.y - this.height / 2;
        const pcx = player.x + player.width / 2, pcy = player.y - player.height / 2;
        const wob = Math.sin(this.flapTime * 0.5) * 8;

        if (!this.summoned && this.hp <= this.maxHp / 2) { // half HP: call two bats
            this.summoned = true;
            bats.push(new Bat(cameraX - 76, 1));
            bats.push(new Bat(cameraX + CANVAS_WIDTH + 40, -1));
        }

        if (this.state === 'enter') {
            this.x -= 2.5;
            this.y = this.hoverY + wob;
            if (this.x <= cameraX + CANVAS_WIDTH - this.width - 120) { this.state = 'hover'; this.cooldown = 60; }
        } else if (this.state === 'hover') {
            this.x += Math.max(-2.2, Math.min(2.2, (pcx - cx) * 0.03));
            this.y = this.hoverY + wob;
            if (--this.cooldown <= 0) {
                if (Math.random() < 0.5) { this.state = 'rain'; this.rainT = 0; this.dir = pcx > cx ? 1 : -1; }
                else { this.state = 'windup'; this.timer = 28; }
            }
        } else if (this.state === 'rain') {      // fly across, dropping poop bombs
            this.x += this.dir * 4;
            this.y = this.hoverY + wob;
            this.rainT++;
            if (this.rainT % 14 === 1) { poops.push(new Poop(this.x + this.width / 2, this.y)); audio.drop(); }
            if (this.rainT >= 56) { this.state = 'hover'; this.cooldown = 70; }
        } else if (this.state === 'windup') {
            this.y -= 0.5;
            if (--this.timer <= 0) {
                const dx = pcx - cx, dy = pcy - cy, len = Math.hypot(dx, dy) || 1;
                this.vx = dx / len * 8.5;
                this.vy = dy / len * 8.5;
                this.state = 'dive';
                this.hitDone = false;
                audio.screech();
            }
        } else if (this.state === 'dive') {
            this.x += this.vx;
            this.y += this.vy;
            this.contact(16);
            if (this.y >= FLOOR_Y - 4 || this.x < cameraX - 40 || this.x + this.width > cameraX + CANVAS_WIDTH + 40) {
                this.state = 'rise';
            }
        } else if (this.state === 'rise') {      // low and slow: your chance to hit it
            this.y -= 4.5;
            this.x += (pcx > cx ? 1 : -1) * 2.5;
            this.contact(16);
            if (this.y <= this.hoverY) { this.y = this.hoverY; this.state = 'hover'; this.cooldown = 40; }
        }
        if (this.state !== 'enter') {
            this.x = Math.max(cameraX + 4, Math.min(cameraX + CANVAS_WIDTH - this.width - 4, this.x));
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x - cameraX + this.width / 2, this.y - this.height / 2);
        if (this.dead) {
            ctx.rotate(Math.min(1, this.deathTimer / 40) * 0.9);
            if (this.deathTimer > 60) ctx.globalAlpha = Math.floor(this.deathTimer / 4) % 2 ? 0.3 : 0.9;
        } else if (this.state === 'windup') {
            ctx.translate((Math.random() - 0.5) * 3, 0);
        }
        ctx.scale(2.4, 2.4);
        const tip = Math.round(Math.sin(this.flapTime) * 11);
        ctx.fillStyle = fcol(this, '#3d1f63');
        [-1, 1].forEach(side => {
            ctx.beginPath();
            ctx.moveTo(side * 5, -3);
            ctx.lineTo(side * 27, -4 - tip);
            ctx.lineTo(side * 22, 2 - tip * 0.5);
            ctx.lineTo(side * 16, 6 - tip * 0.25);
            ctx.lineTo(side * 10, 4);
            ctx.lineTo(side * 5, 5);
            ctx.closePath();
            ctx.fill();
        });
        ctx.fillStyle = fcol(this, '#1c1028');
        ctx.fillRect(-6, -6, 12, 13);
        ctx.fillRect(-6, -10, 4, 5);
        ctx.fillRect(2, -10, 4, 5);
        ctx.fillStyle = '#ff2222';
        ctx.fillRect(-4, -3, 3, 3);
        ctx.fillRect(1, -3, 3, 3);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-3, 3, 2, 3);
        ctx.fillRect(1, 3, 2, 3);
        ctx.restore();
        if (this.state === 'windup' && !this.dead) {
            ctx.fillStyle = '#ff0000';
            ctx.font = 'bold 30px "Courier New"';
            ctx.fillText('!', this.x - cameraX + this.width / 2 - 8, this.y - this.height - 10);
        }
    }
}

// Stage 3: YOKOZUNA - leaps across the arena, sends shock waves along the floor, slaps up close
class SumoBoss extends Boss {
    constructor(x) {
        super(x);
        this.name = 'YOKOZUNA';
        this.width = 90; this.height = 110;
        this.hp = 55; this.maxHp = 55;
        this.noKnockback = true;
        this.state = 'ground';
        this.timer = 50;
        this.vx = 0; this.vy = 0; this.t = 0; this.ring = 0;
        this.entered = false;
    }

    leap(dx) {
        const T = 60;
        this.vy = -0.55 * T / 2;
        this.vx = Math.max(-8, Math.min(8, dx / T));
        this.state = 'air';
        this.hitDone = false;
        audio.leap();
    }

    update() {
        if (this.tickDead()) return;
        if (this.flash > 0) this.flash--;
        this.t++;
        if (this.ring > 0) this.ring--;
        const cx = this.x + this.width / 2;
        const pcx = player.x + player.width / 2;

        if (this.state === 'ground') {           // stomp telegraph
            this.facing = pcx > cx ? 'right' : 'left';
            if (--this.timer <= 0) {
                if (Math.abs(pcx - cx) < 110) { this.state = 'windup'; this.timer = 20; }
                else this.leap(pcx - cx);
            }
        } else if (this.state === 'windup') {    // about to slap
            if (--this.timer <= 0) { this.state = 'attack'; this.timer = 12; this.hitDone = false; }
        } else if (this.state === 'attack') {    // tsuppari: double palm thrust
            if (!this.hitDone && player.hurtTimer <= 0) {
                const hx1 = this.facing === 'right' ? this.x + this.width : this.x - 80;
                if (playerTouches(hx1, hx1 + 80, this.y - 100, this.y - 30)) {
                    this.hitDone = true;
                    hurtPlayer(14, cx);
                }
            }
            if (--this.timer <= 0) { this.state = 'ground'; this.timer = 40; }
        } else if (this.state === 'air') {       // flying body press
            this.vy += 0.55;
            this.x += this.vx;
            this.y += this.vy;
            if (!this.hitDone && player.hurtTimer <= 0 &&
                playerTouches(this.x + 5, this.x + this.width - 5, this.y - this.height, this.y)) {
                this.hitDone = true;
                hurtPlayer(16, cx);
            }
            if (this.y >= FLOOR_Y && this.vy > 0) {
                this.y = FLOOR_Y; this.vy = 0; this.vx = 0;
                this.state = 'ground'; this.timer = 60; this.ring = 20;
                this.entered = true;
                audio.slam();
                const lx = this.x + this.width / 2;
                bullets.push(new Bullet(lx - 20, FLOOR_Y - 8, -5, 0, 'wave')); // jump over these!
                bullets.push(new Bullet(lx + 20, FLOOR_Y - 8, 5, 0, 'wave'));
            }
        }
        if (this.entered) {
            this.x = Math.max(cameraX + 4, Math.min(cameraX + CANVAS_WIDTH - this.width - 4, this.x));
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x - cameraX + this.width / 2, this.y);
        if (this.ring > 0) {
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.ellipse(0, -2, (20 - this.ring) * 7 + 20, (20 - this.ring) * 1.6 + 3, 0, 0, Math.PI * 2);
            ctx.stroke();
        }
        const dir = this.facing === 'right' ? 1 : -1;
        if (this.dead) {
            ctx.rotate(-dir * Math.min(1, this.deathTimer / 40) * Math.PI / 2);
            if (this.deathTimer > 60) ctx.globalAlpha = Math.floor(this.deathTimer / 4) % 2 ? 0.3 : 0.9;
        }
        ctx.scale(dir * 1.55, 1.55);
        const air = this.state === 'air';
        const stomping = this.state === 'ground' || this.state === 'windup';
        const sw = Math.sin(this.t * 0.3);
        drawSumoSprite(this, {
            boss: true,
            lift: stomping ? Math.round(Math.max(0, sw) * 10) : 0,
            lift2: stomping ? Math.round(Math.max(0, -sw) * 10) : 0,
            arms: air ? 'press' : (this.state === 'windup' || this.state === 'attack') ? 'slap' : 'side'
        });
        ctx.restore();
        if (this.state === 'windup' && !this.dead) {
            ctx.fillStyle = '#ff0000';
            ctx.font = 'bold 30px "Courier New"';
            ctx.fillText('!', this.x - cameraX + this.width / 2 - 8, this.y - this.height - 16);
        }
    }
}

// Stage 4: KING CONDOR - fans out feathers, dives at the player
class CondorBoss extends Boss {
    constructor(x) {
        super(x);
        this.name = 'KING CONDOR';
        this.width = 100; this.height = 60;
        this.hp = 50; this.maxHp = 50;
        this.hoverY = 215;
        this.y = this.hoverY;
        this.noKnockback = true;
        this.flap = 0; this.vx = 0; this.vy = 0; this.face = -1;
    }

    contact(dmg) {
        if (this.hitDone || player.hurtTimer > 0) return;
        if (playerTouches(this.x + 10, this.x + this.width - 10, this.y - this.height + 10, this.y - 5)) {
            this.hitDone = true;
            hurtPlayer(dmg, this.x + this.width / 2);
        }
    }

    fireFeathers() {
        const cx = this.x + this.width / 2, cy = this.y - this.height / 2;
        const base = Math.atan2(player.y - player.height / 2 - cy, player.x + player.width / 2 - cx);
        [-0.3, 0, 0.3].forEach(a => {
            bullets.push(new Bullet(cx, cy, Math.cos(base + a) * 5.5, Math.sin(base + a) * 5.5, 'feather'));
        });
        audio.drop();
    }

    update() {
        if (this.tickDead()) return;
        if (this.flash > 0) this.flash--;
        this.flap += this.state === 'dive' ? 0.1 : 0.35;
        const cx = this.x + this.width / 2, cy = this.y - this.height / 2;
        const pcx = player.x + player.width / 2, pcy = player.y - player.height / 2;
        const wob = Math.sin(this.flap * 0.5) * 8;

        if (this.state === 'enter') {
            this.x -= 3;
            this.y = this.hoverY + wob;
            this.face = -1;
            if (this.x <= cameraX + CANVAS_WIDTH - this.width - 100) { this.state = 'hover'; this.cooldown = 60; }
        } else if (this.state === 'hover') {
            this.face = pcx > cx ? 1 : -1;
            this.x += Math.max(-2.6, Math.min(2.6, (pcx - cx) * 0.03));
            this.y = this.hoverY + wob;
            if (--this.cooldown <= 0) {
                this.state = Math.random() < 0.5 ? 'fan' : 'warn';
                this.timer = 34;
                if (this.state === 'warn') audio.screech();
            }
        } else if (this.state === 'fan') {       // flap hard and throw 3 feathers
            this.face = pcx > cx ? 1 : -1;
            this.flap += 0.3;
            if (--this.timer === 17) this.fireFeathers();
            if (this.timer <= 0) { this.state = 'hover'; this.cooldown = 60; }
        } else if (this.state === 'warn') {
            this.face = pcx > cx ? 1 : -1;
            this.y -= 0.5;
            if (--this.timer <= 0) {
                const dx = pcx - cx, dy = pcy - cy, len = Math.hypot(dx, dy) || 1;
                this.vx = dx / len * 10.5;
                this.vy = dy / len * 10.5;
                this.face = this.vx >= 0 ? 1 : -1;
                this.state = 'dive';
                this.hitDone = false;
            }
        } else if (this.state === 'dive') {
            this.x += this.vx;
            this.y += this.vy;
            this.contact(18);
            if (this.y >= FLOOR_Y - 4 || this.x < cameraX - 40 || this.x + this.width > cameraX + CANVAS_WIDTH + 40) {
                this.state = 'rise';
            }
        } else if (this.state === 'rise') {
            this.y -= 4.5;
            this.x += (pcx > cx ? 1 : -1) * 2.5;
            this.contact(18);
            if (this.y <= this.hoverY) { this.y = this.hoverY; this.state = 'hover'; this.cooldown = 40; }
        }
        if (this.state !== 'enter') {
            this.x = Math.max(cameraX + 4, Math.min(cameraX + CANVAS_WIDTH - this.width - 4, this.x));
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x - cameraX + this.width / 2, this.y - this.height / 2);
        if (this.dead) {
            ctx.rotate(this.face * Math.min(1, this.deathTimer / 40) * 0.9);
            if (this.deathTimer > 60) ctx.globalAlpha = Math.floor(this.deathTimer / 4) % 2 ? 0.3 : 0.9;
        } else if (this.state === 'warn') {
            ctx.translate((Math.random() - 0.5) * 3, 0);
        }
        ctx.scale(this.face * 1.8, 1.8);
        const diving = this.state === 'dive' || this.state === 'rise';
        if (this.state === 'dive') ctx.rotate(Math.atan2(this.vy, Math.abs(this.vx)) * 0.8);
        drawCondorSprite(this, { fl: diving ? -0.6 : Math.sin(this.flap), warn: this.state === 'warn' });
        ctx.restore();
        if (this.state === 'warn' && !this.dead) {
            ctx.fillStyle = '#ff0000';
            ctx.font = 'bold 30px "Courier New"';
            ctx.fillText('!', this.x - cameraX + this.width / 2 - 8, this.y - this.height - 14);
        }
    }
}

// Stage 5: RAT DON - machine-gun bursts at two heights, calls gang rats at 66% and 33% HP
class RatBoss extends Boss {
    constructor(x) {
        super(x);
        this.name = 'RAT DON';
        this.width = 70; this.height = 64;
        this.hp = 60; this.maxHp = 60;
        this.noKnockback = true;
        this.summonStage = 0;
        this.shotsFired = 0; this.shotT = 0;
        this.walkT = 0; this.muzzle = 0; this.biteCd = 0;
    }

    update() {
        if (this.tickDead()) return;
        if (this.flash > 0) this.flash--;
        if (this.muzzle > 0) this.muzzle--;
        if (this.biteCd > 0) this.biteCd--;
        const cx = this.x + this.width / 2;
        const pcx = player.x + player.width / 2;
        const dist = Math.abs(pcx - cx);
        const toward = pcx > cx ? 1 : -1;
        let moving = false;

        if (this.state === 'enter') {
            this.x -= 2;
            moving = true;
            if (this.x <= cameraX + CANVAS_WIDTH - this.width - 120) { this.state = 'idle'; this.cooldown = 40; }
        } else if (this.state === 'idle') {
            this.facing = toward === 1 ? 'right' : 'left';
            const ratio = this.hp / this.maxHp;
            if ((this.summonStage === 0 && ratio <= 0.66) || (this.summonStage === 1 && ratio <= 0.33)) {
                this.summonStage++;
                this.state = 'summon';
                this.timer = 45;
            } else {
                if (dist < 150) { this.x -= toward * 1.6; moving = true; }       // keeps its distance
                else if (dist > 280) { this.x += toward * 1.3; moving = true; }
                if (this.cooldown > 0) this.cooldown--;
                else { this.state = 'windup'; this.timer = 22; }
            }
        } else if (this.state === 'windup') {
            if (--this.timer <= 0) { this.state = 'attack'; this.shotT = 0; this.shotsFired = 0; }
        } else if (this.state === 'attack') {    // 5-shot burst: low, high, low, high, low
            this.shotT++;
            if (this.shotsFired < 5 && this.shotT % 9 === 1) {
                const dir = this.facing === 'right' ? 1 : -1;
                const low = this.shotsFired % 2 === 0;
                bullets.push(new Bullet(this.x + this.width / 2 + dir * 50, low ? FLOOR_Y - 14 : FLOOR_Y - 52, dir * 7, 0, 'bullet'));
                this.muzzle = 5;
                this.shotsFired++;
                audio.gun();
            }
            if (this.shotT >= 55) { this.state = 'recover'; this.timer = 40; }
        } else if (this.state === 'summon') {
            if (--this.timer === 20) {
                if (enemies.filter(e => e.active && e.kind === 'rat').length < 4) {
                    enemies.push(new GangRat(cameraX - 60));
                    enemies.push(new GangRat(cameraX + CANVAS_WIDTH + 30));
                }
            }
            if (this.timer <= 0) { this.state = 'idle'; this.cooldown = 70; }
        } else if (this.state === 'recover') {
            if (--this.timer <= 0) { this.state = 'idle'; this.cooldown = 40 + Math.floor(Math.random() * 30); }
        }

        // Bites if you stand too close
        if (dist < 55 && this.biteCd <= 0 && player.hurtTimer <= 0 && player.y >= FLOOR_Y - 30) {
            hurtPlayer(8, cx);
            this.biteCd = 60;
        }
        if (moving) this.walkT += 0.2; else this.walkT = 0;
        if (this.state !== 'enter') {
            this.x = Math.max(cameraX + 4, Math.min(cameraX + CANVAS_WIDTH - this.width - 4, this.x));
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x - cameraX + this.width / 2, this.y);
        const dir = this.facing === 'right' ? 1 : -1;
        if (this.dead) {
            ctx.rotate(-dir * Math.min(1, this.deathTimer / 40) * Math.PI / 2);
            if (this.deathTimer > 60) ctx.globalAlpha = Math.floor(this.deathTimer / 4) % 2 ? 0.3 : 0.9;
        }
        ctx.scale(dir * 1.9, 1.9);
        drawRatSprite(this, {
            walk: this.walkT,
            aim: this.state === 'windup' || this.state === 'attack',
            muzzle: this.muzzle > 0,
            suit: '#f2f2f2', hat: '#f2f2f2', fur: '#6b5a50'
        });
        ctx.restore();
        if (this.state === 'windup' && !this.dead) {
            ctx.fillStyle = '#ff0000';
            ctx.font = 'bold 30px "Courier New"';
            ctx.fillText('!', this.x - cameraX + this.width / 2 - 8, this.y - this.height - 24);
        }
        if (this.state === 'summon' && !this.dead) {
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px "Courier New"';
            ctx.textAlign = 'center';
            ctx.fillText('GET HIM, BOYS!', this.x - cameraX + this.width / 2, this.y - this.height - 30);
            ctx.textAlign = 'left';
        }
    }
}

// --- Action Triggers ---
function triggerPunch() {
    audio.init();

    // Grabbed: only Shoryuken (Up + Punch) can break free; normal punch is disabled
    if (player.grabbedBy.length > 0) {
        if (!keys.up) return;
        player.grabbedBy.forEach(e => e.active = false);
        player.grabbedBy = [];
        audio.escape();
    }

    // Check Shoryuken (Up + Punch)
    if (keys.up) {
        player.isAttacking = true;
        player.attackId++;
        player.attackType = 'shoryuken';
        player.attackTimer = 25;
        player.vy = -12;
        player.isGrounded = false;
        audio.shoryuken();
        checkHit('shoryuken');
        return;
    }

    // Direction (left / right / down) + Punch: throw a knife if holding any
    if ((keys.left || keys.right || keys.down) && player.knives > 0) {
        throwKnife();
        return;
    }

    // Normal Punch
    if (!player.isAttacking) {
        player.isAttacking = true;
        player.attackId++;
        player.attackType = 'punch';
        player.attackTimer = 12;
        audio.punch();
        checkHit('punch');
    }
}

function triggerKick() {
    audio.init();

    // Check Tornado Kick (連打 Kick)
    const now = Date.now();
    lastKickTime.push(now);
    lastKickTime = lastKickTime.filter(t => now - t < 500);

    if (lastKickTime.length >= 3 || player.grabbedBy.length > 0 && lastKickTime.length >= 2) {
        // Escape grab or execute Tornado
        if (player.grabbedBy.length > 0) {
            player.grabbedBy.forEach(e => e.active = false);
            player.grabbedBy = [];
            audio.escape();
        }
        player.isAttacking = true;
        player.attackId++;
        player.attackType = 'tornado';
        player.attackTimer = 35;
        player.vy = -6;
        player.isGrounded = false;
        audio.tornado();
        checkHit('tornado');
        lastKickTime = [];
        return;
    }

    if (player.grabbedBy.length > 0) return; // Cannot normal kick while grabbed

    // Normal Kick
    if (!player.isAttacking) {
        player.isAttacking = true;
        player.attackId++;
        player.attackType = 'kick';
        player.attackTimer = 15;
        audio.kick();
        checkHit('kick');
    }
}

function triggerJump() {
    audio.init();
    if (player.grabbedBy.length > 0) return;
    if (player.isGrounded && !player.isAttacking) {
        player.vy = -13;
        player.isGrounded = false;
    }
}

function checkHit(type) {
    [...enemies, ...bats, ...(boss ? [boss] : [])].forEach(e => {
        if (!e.active) return;
        if (e.crouchOnly && !player.isCrouching) return; // gang rats can only be hit while crouching

        let hitBox = { x: 0, w: 0, y: 0, h: 0 };
        if (type === 'shoryuken') {
            hitBox = { x: player.x - 20, w: player.width + 40, y: player.y - player.height - 40, h: player.height + 40 };
        } else if (type === 'tornado') {
            hitBox = { x: player.x - 40, w: player.width + 80, y: player.y - player.height - 20, h: player.height + 20 };
        } else if (type === 'punch') {
            let px = player.facing === 'right' ? player.x + player.width : player.x - 30;
            hitBox = { x: px, w: 30, y: player.isCrouching ? player.y - 40 : player.y - player.height, h: 30 };
        } else if (type === 'kick') {
            let kx = player.facing === 'right' ? player.x + player.width : player.x - 35;
            hitBox = { x: kx, w: 35, y: player.y - player.height / 2, h: 35 };
        }

        // Collision Box Check
        if (e.x < hitBox.x + hitBox.w &&
            e.x + e.width > hitBox.x &&
            e.y - e.height < hitBox.y + hitBox.h &&
            e.y > hitBox.y) {
            
            hitTarget(e, HIT_DAMAGE[type], player.attackId);
        }
    });
}

// --- Render Helper Functions ---
const THEMES = [null,
    { sky: '#110522', floor: '#441133', line: '#ffaa00' },  // 1 temple
    { sky: '#050818', floor: '#16261d', line: '#4a7a5a' },  // 2 night forest
    { sky: '#2b1608', floor: '#d2b07a', line: '#8b5a2b' },  // 3 sumo arena
    { sky: '#3b1030', floor: '#7a4a2a', line: '#d9a15a' },  // 4 canyon
    { sky: '#07070f', floor: '#25252e', line: '#ffdd44' },  // 5 back alley
];

function drawBackground() {
    const th = THEMES[stage] || THEMES[1];
    const W = CANVAS_WIDTH;

    // Sky
    if (stage === 4) {
        const g = ctx.createLinearGradient(0, 0, 0, FLOOR_Y);
        g.addColorStop(0, '#3b1030');
        g.addColorStop(1, '#e0772c');
        ctx.fillStyle = g;
    } else {
        ctx.fillStyle = th.sky;
    }
    ctx.fillRect(0, 0, W, CANVAS_HEIGHT);

    // Far scenery (parallax)
    if (stage === 2) {
        ctx.fillStyle = '#d8d8b0';                       // stars
        for (let i = 0; i < 40; i++) {
            ctx.fillRect(((i * 97) % 800 - cameraX * 0.05 + 800) % 800, (i * 53) % 200, 2, 2);
        }
        ctx.fillStyle = '#f4f0c0';                       // moon
        ctx.beginPath(); ctx.arc(640 - cameraX * 0.03, 90, 36, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#05081899';
        ctx.beginPath(); ctx.arc(654 - cameraX * 0.03, 82, 30, 0, Math.PI * 2); ctx.fill();
    } else if (stage === 3) {
        for (let i = 0; i < 6; i++) {                    // paper lanterns
            const lx = ((i * 190 - cameraX * 0.4) % 1140 + 1140) % 1140 - 100;
            ctx.fillStyle = '#6b1a1a'; ctx.fillRect(lx + 14, 0, 2, 40);
            ctx.fillStyle = '#d63a2a'; ctx.beginPath(); ctx.ellipse(lx + 15, 58, 16, 20, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ffd27a'; ctx.fillRect(lx + 8, 54, 14, 4);
        }
    } else if (stage === 4) {
        ctx.fillStyle = '#ffd27a';                       // sun
        ctx.beginPath(); ctx.arc(560 - cameraX * 0.02, FLOOR_Y - 40, 60, 0, Math.PI * 2); ctx.fill();
        const k = Math.floor(cameraX * 0.2 / 180);       // far mountains
        ctx.fillStyle = '#3a1a2a';
        for (let i = -1; i < 6; i++) {
            const idx = k + i, mx = idx * 180 - cameraX * 0.2, h = 100 + (((idx * 53) % 4) + 4) % 4 * 40;
            ctx.beginPath(); ctx.moveTo(mx, FLOOR_Y); ctx.lineTo(mx + 90, FLOOR_Y - h); ctx.lineTo(mx + 180, FLOOR_Y); ctx.fill();
        }
    } else if (stage === 5) {
        const k = Math.floor(cameraX * 0.3 / 110);       // city skyline
        for (let i = -1; i < 9; i++) {
            const idx = k + i, bx = idx * 110 - cameraX * 0.3, h = 90 + (((idx * 37) % 5) + 5) % 5 * 30;
            ctx.fillStyle = '#12121f';
            ctx.fillRect(bx, FLOOR_Y - h, 100, h);
            for (let r = 0; r < Math.floor(h / 22); r++) {
                for (let c = 0; c < 4; c++) {
                    if ((((idx * 7 + r * 3 + c) % 3) + 3) % 3 === 0) {
                        ctx.fillStyle = '#ffd966';
                        ctx.fillRect(bx + 10 + c * 22, FLOOR_Y - h + 10 + r * 22, 10, 12);
                    }
                }
            }
        }
    }

    // Floor
    ctx.fillStyle = th.floor;
    ctx.fillRect(0, FLOOR_Y, W, CANVAS_HEIGHT - FLOOR_Y);
    if (stage === 3) {                                   // straw rope marks on the ring
        ctx.fillStyle = '#9c7a44';
        for (let i = -cameraX % 120; i < W; i += 120) ctx.fillRect(i, FLOOR_Y + 30, 60, 6);
    } else if (stage === 5) {                            // road markings
        ctx.fillStyle = '#555566';
        for (let i = -cameraX % 100; i < W; i += 100) ctx.fillRect(i, FLOOR_Y + 40, 50, 5);
    }

    // Foreground pillars / trees / rocks / lamp posts
    for (let i = -cameraX % 150; i < W; i += 150) {
        if (stage === 2) {
            ctx.fillStyle = '#2a1c14'; ctx.fillRect(i + 4, 110, 14, FLOOR_Y - 110);
            ctx.fillStyle = '#0f3a24';
            ctx.beginPath(); ctx.ellipse(i + 11, 105, 42, 46, 0, 0, Math.PI * 2); ctx.fill();
        } else if (stage === 4) {
            ctx.fillStyle = '#5a3020';
            ctx.beginPath(); ctx.moveTo(i - 20, FLOOR_Y); ctx.lineTo(i + 10, 120); ctx.lineTo(i + 40, FLOOR_Y); ctx.fill();
            ctx.fillStyle = '#7a4a2a';
            ctx.beginPath(); ctx.moveTo(i + 10, 120); ctx.lineTo(i + 40, FLOOR_Y); ctx.lineTo(i + 14, FLOOR_Y); ctx.fill();
        } else if (stage === 5) {
            ctx.fillStyle = '#44444f'; ctx.fillRect(i + 8, 110, 6, FLOOR_Y - 110);
            ctx.fillRect(i + 8, 110, 30, 5);
            ctx.fillStyle = 'rgba(255, 221, 68, 0.25)'; ctx.beginPath(); ctx.arc(i + 36, 124, 26, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ffdd44'; ctx.fillRect(i + 31, 116, 12, 8);
        } else {
            ctx.fillStyle = stage === 3 ? '#a01c1c' : '#661122';
            ctx.fillRect(i, 50, 20, FLOOR_Y - 50);
            ctx.fillRect(i - 10, 40, 40, 15);
        }
    }

    // Floor Line
    ctx.fillStyle = th.line;
    ctx.fillRect(0, FLOOR_Y, W, 4);
}

function drawUI() {
    // Health Bar
    ctx.fillStyle = '#333';
    ctx.fillRect(20, 20, 200, 20);
    ctx.fillStyle = player.hp > 30 ? '#00ff00' : '#ff0000';
    ctx.fillRect(20, 20, (player.hp / player.maxHp) * 200, 20);
    ctx.strokeStyle = '#fff';
    ctx.strokeRect(20, 20, 200, 20);

    // Score & Controls info
    ctx.fillStyle = '#fff';
    ctx.font = '16px "Courier New"';
    ctx.fillText(`SCORE: ${score}`, 240, 35);
    ctx.fillText(`STAGE ${stage}`, 680, 35);

    if (player.grabbedBy.length > 0) {
        ctx.fillStyle = '#ff0000';
        ctx.font = 'bold 22px "Courier New"';
        ctx.fillText('GRABBED! MASH KICK TO ESCAPE!', CANVAS_WIDTH / 2 - 180, 100);
        ctx.font = 'bold 16px "Courier New"';
        ctx.fillText('OR UP + PUNCH (SHORYUKEN)', CANVAS_WIDTH / 2 - 130, 125);
    }

    // Knife count
    ctx.save();
    ctx.translate(680, 53);
    drawKnifeShape();
    ctx.restore();
    ctx.fillStyle = '#fff';
    ctx.font = '16px "Courier New"';
    ctx.fillText(`x${player.knives}`, 712, 58);

    // Lives left
    ctx.font = 'bold 14px "Courier New"';
    ctx.fillText(`LIVES x${lives}`, 20, 57);

    // Boss HP gauge
    if (boss) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px "Courier New"';
        ctx.fillText(boss.name, 20, 75);
        ctx.fillStyle = '#333';
        ctx.fillRect(130, 62, 250, 16);
        ctx.fillStyle = '#ff4500';
        ctx.fillRect(130, 62, (boss.hp / boss.maxHp) * 250, 16);
        ctx.strokeStyle = '#fff';
        ctx.strokeRect(130, 62, 250, 16);
    }

    // Boss warning / defeated banners
    ctx.textAlign = 'center';
    if (bossWarning > 0 && Math.floor(bossWarning / 10) % 2 === 0) {
        ctx.fillStyle = '#ff0000';
        ctx.font = 'bold 30px "Courier New"';
        ctx.fillText('WARNING!! BOSS APPROACHING', CANVAS_WIDTH / 2, 160);
    }
    if (boss && boss.dead) {
        ctx.fillStyle = '#00ff00';
        ctx.font = 'bold 30px "Courier New"';
        ctx.fillText('BOSS DEFEATED!', CANVAS_WIDTH / 2, 160);
    }
    if (msgTimer > 0) {
        ctx.fillStyle = '#ffee66';
        ctx.font = 'bold 26px "Courier New"';
        ctx.fillText(msgText, CANVAS_WIDTH / 2, 125);
    }
    if (stageBanner > 0) {
        ctx.globalAlpha = Math.min(1, stageBanner / 30);
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 44px "Courier New"';
        ctx.fillText(`STAGE ${stage}`, CANVAS_WIDTH / 2, 190);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px "Courier New"';
        ctx.fillText(stageCfg().name, CANVAS_WIDTH / 2, 225);
        ctx.fillStyle = '#ff8888';
        ctx.font = '16px "Courier New"';
        ctx.fillText(stageCfg().intro, CANVAS_WIDTH / 2, 255);
        ctx.globalAlpha = 1;
    }
    ctx.textAlign = 'left';
}

// --- Main Loop ---
function gameLoop() {
    ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    // Music: schedule notes; fanfare / game-over jingle when the state changes
    if (gameState !== lastState) {
        if (gameState === 'CLEAR' || gameState === 'GAMEOVER') {
            bgm.stop();
            bgm.jingle(gameState === 'CLEAR');
        }
        lastState = gameState;
    }
    bgm.tick();

    // Short input lock after game over / stage clear so a mashed button doesn't skip the screen
    if (gameState === 'GAMEOVER' || gameState === 'CLEAR') stateTimer++; else stateTimer = 0;

    if (gameState === 'START') {
        drawBackground();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 36px "Courier New"';
        ctx.fillText('DRAGON BLOW', CANVAS_WIDTH / 2 - 160, 180);
        ctx.font = '18px "Courier New"';
        ctx.fillText('PRESS ANY KEY OR BUTTON TO START', CANVAS_WIDTH / 2 - 180, 240);
        ctx.fillText('UP+PUNCH: SHORYUKEN | MULTI-KICK: TORNADO', CANVAS_WIDTH / 2 - 220, 280);
        ctx.fillText('LEFT/RIGHT/DOWN+PUNCH: THROW KNIFE', CANVAS_WIDTH / 2 - 185, 310);
        ctx.fillText('1UP EVERY 10000 PTS | M: MUSIC ON/OFF', CANVAS_WIDTH / 2 - 200, 340);
    } else if (gameState === 'PLAYING') {
        spawnAll();

        player.update();
        enemies.forEach(e => e.update());
        bats.forEach(b => b.update());
        poops.forEach(p => p.update());
        bullets.forEach(b => b.update());
        knifeItems.forEach(k => k.update());
        thrownKnives.forEach(k => k.update());
        if (boss) boss.update();
        enemies = enemies.filter(e => e.active);
        bats = bats.filter(b => b.active);
        poops = poops.filter(p => p.active);
        bullets = bullets.filter(b => b.active);
        knifeItems = knifeItems.filter(k => k.active);
        thrownKnives = thrownKnives.filter(k => k.active);
        if (bossWarning > 0) bossWarning--;
        if (stageBanner > 0) stageBanner--;
        if (msgTimer > 0) msgTimer--;
        popups.forEach(p => { p.y -= 0.6; p.t--; });
        popups = popups.filter(p => p.t > 0);

        // Extra life every EXTEND_SCORE points
        while (score >= nextExtend) {
            nextExtend += EXTEND_SCORE;
            lives++;
            audio.oneUp();
            showMsg(`1UP!  LIVES x${lives}`, 100);
        }

        drawBackground();
        knifeItems.forEach(k => k.draw());
        player.draw();
        enemies.forEach(e => e.draw());
        if (boss) boss.draw();
        poops.forEach(p => p.draw());
        bats.forEach(b => b.draw());
        bullets.forEach(b => b.draw());
        thrownKnives.forEach(k => k.draw());
        drawPopups();
        drawUI();

        // Stage end: the boss appears (the stage clears when the boss is defeated)
        if (!boss && cameraX >= STAGE_LENGTH - CANVAS_WIDTH) {
            startBoss();
        }
    } else if (gameState === 'GAMEOVER') {
        drawBackground();
        ctx.fillStyle = '#ff0000';
        ctx.font = 'bold 40px "Courier New"';
        ctx.fillText('GAME OVER', CANVAS_WIDTH / 2 - 110, 200);
        ctx.font = '18px "Courier New"';
        ctx.fillStyle = '#fff';
        ctx.fillText('PRESS PUNCH/KICK TO RESTART', CANVAS_WIDTH / 2 - 150, 260);
        ctx.fillText(`REACHED STAGE ${stage}  SCORE: ${score}`, CANVAS_WIDTH / 2 - 150, 300);
    } else if (gameState === 'CLEAR') {
        drawBackground();
        ctx.textAlign = 'center';
        ctx.fillStyle = '#00ff00';
        ctx.font = 'bold 40px "Courier New"';
        if (stage < MAX_STAGE) {
            ctx.fillText(`STAGE ${stage} CLEAR!`, CANVAS_WIDTH / 2, 190);
            ctx.font = '18px "Courier New"';
            ctx.fillStyle = '#fff';
            ctx.fillText(`SCORE: ${score}`, CANVAS_WIDTH / 2, 240);
            ctx.fillText('PRESS PUNCH/KICK FOR NEXT STAGE', CANVAS_WIDTH / 2, 280);
        } else {
            ctx.fillText('ALL STAGES CLEAR!', CANVAS_WIDTH / 2, 190);
            ctx.font = '18px "Courier New"';
            ctx.fillStyle = '#fff';
            ctx.fillText('CONGRATULATIONS, DRAGON MASTER!', CANVAS_WIDTH / 2, 230);
            ctx.fillText(`FINAL SCORE: ${score}`, CANVAS_WIDTH / 2, 265);
            ctx.fillText('PRESS PUNCH/KICK TO PLAY AGAIN', CANVAS_WIDTH / 2, 305);
        }
        ctx.textAlign = 'left';
    }

    requestAnimationFrame(gameLoop);
}

// --- Event Listeners ---
window.addEventListener('keydown', e => {
    audio.init();
    if (e.code === 'KeyM') { bgm.toggleMute(); return; }
    if (gameState !== 'PLAYING') {
        if (e.code === 'KeyZ' || e.code === 'KeyX' || e.code === 'Space' || e.code === 'Enter') {
            handleStartPress();
        }
        return;
    }

    switch (e.code) {
        case 'ArrowLeft': case 'KeyA': keys.left = true; break;
        case 'ArrowRight': case 'KeyD': keys.right = true; break;
        case 'ArrowUp': case 'KeyW': keys.up = true; break;
        case 'ArrowDown': case 'KeyS': keys.down = true; break;
        case 'KeyZ': case 'KeyJ': 
            keys.punch = true; 
            triggerPunch(); 
            break;
        case 'KeyX': case 'KeyK': 
            keys.kick = true; 
            triggerKick(); 
            break;
        case 'Space':
            keys.jump = true;
            triggerJump();
            break;
    }
});

window.addEventListener('keyup', e => {
    switch (e.code) {
        case 'ArrowLeft': case 'KeyA': keys.left = false; break;
        case 'ArrowRight': case 'KeyD': keys.right = false; break;
        case 'ArrowUp': case 'KeyW': keys.up = false; break;
        case 'ArrowDown': case 'KeyS': keys.down = false; break;
        case 'KeyZ': case 'KeyJ': keys.punch = false; break;
        case 'KeyX': case 'KeyK': keys.kick = false; break;
        case 'Space': keys.jump = false; break;
    }
});

// Mobile Controls Handlers
function bindBtn(id, keyName, onPress) {
    const el = document.getElementById(id);
    if (!el) return;
    
    const start = (e) => {
        e.preventDefault();
        audio.init();
        if (gameState !== 'PLAYING') {
            handleStartPress();
            return;
        }
        if (keyName) keys[keyName] = true;
        if (onPress) onPress();
    };

    const end = (e) => {
        e.preventDefault();
        if (keyName) keys[keyName] = false;
    };

    el.addEventListener('touchstart', start);
    el.addEventListener('touchend', end);
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', end);
}

bindBtn('btn-up', 'up');
bindBtn('btn-down', 'down');
bindBtn('btn-left', 'left');
bindBtn('btn-right', 'right');
bindBtn('btn-punch', 'punch', triggerPunch);
bindBtn('btn-kick', 'kick', triggerKick);
bindBtn('btn-jump', 'jump', triggerJump);

// Start Loop
requestAnimationFrame(gameLoop);
</script>
