<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRAGON BLOW — The Fighting God's Corridor —</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 450px;
            background: #000;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            border: 4px solid #333;
            border-radius: 6px;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
        }
        /* CRT Scanline effect */
        .crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 10;
        }
        /* UI Controls for Touch Devices */
        #mobile-controls {
            display: flex;
            justify-content: space-between;
            width: 800px;
            max-width: 100vw;
            margin-top: 10px;
            padding: 0 10px;
        }
        .dpad, .action-buttons {
            display: grid;
            gap: 5px;
        }
        .dpad {
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
        }
        .action-buttons {
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: 60px;
            align-items: center;
        }
        .btn {
            background: #222;
            border: 2px solid #555;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            touch-action: manipulation;
            cursor: pointer;
        }
        .btn:active {
            background: #555;
        }
        .btn-p { background: #b22222; }
        .btn-k { background: #1e90ff; }
        .btn-j { background: #32cd32; }
        
        @media (max-width: 820px) {
            #game-container {
                width: 100vw;
                height: 56.25vw;
            }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    <div class="crt-overlay"></div>
</div>

<div id="mobile-controls">
    <div class="dpad">
        <div></div>
        <div class="btn" id="btn-up">▲</div>
        <div></div>
        <div class="btn" id="btn-left">◀</div>
        <div></div>
        <div class="btn" id="btn-right">▶</div>
        <div></div>
        <div class="btn" id="btn-down">▼</div>
        <div></div>
    </div>
    <div class="action-buttons">
        <div class="btn btn-p" id="btn-punch">PUNCH</div>
        <div class="btn btn-k" id="btn-kick">KICK</div>
        <div class="btn btn-j" id="btn-jump">JUMP</div>
    </div>
</div>

<script>
// --- Web Audio API Integration ---
class SoundController {
    constructor() {
        this.ctx = null;
        this.isMuted = false;
    }

    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
    }

    playNoise(duration, volume = 0.1) {
        if (!this.ctx || this.isMuted) return;
        const bufferSize = this.ctx.sampleRate * duration;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(volume, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);

        noise.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();
    }

    playTone(freq, type, duration, volume = 0.1) {
        if (!this.ctx || this.isMuted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

        gain.gain.setValueAtTime(volume, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    }

    punch() { this.playNoise(0.08, 0.2); }
    kick() { this.playNoise(0.12, 0.3); }
    hit() { 
        this.playTone(150, 'square', 0.1, 0.2);
        this.playNoise(0.1, 0.2);
    }
    shoryuken() {
        if (!this.ctx || this.isMuted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
    }
    tornado() {
        if (!this.ctx || this.isMuted) return;
        for (let i = 0; i < 4; i++) {
            setTimeout(() => {
                this.playTone(300 + i * 50, 'sawtooth', 0.08, 0.15);
                this.playNoise(0.05, 0.15);
            }, i * 60);
        }
    }
    grab() { this.playTone(80, 'sawtooth', 0.15, 0.2); }
    escape() { this.playTone(400, 'triangle', 0.1, 0.2); }
    drop() { this.playTone(700, 'triangle', 0.08, 0.1); }
    splat() {
        this.playTone(120, 'sawtooth', 0.12, 0.2);
        this.playNoise(0.1, 0.15);
    }
    pickup() {
        this.playTone(900, 'square', 0.06, 0.1);
        setTimeout(() => this.playTone(1300, 'square', 0.08, 0.1), 60);
    }
    throwKnife() {
        this.playNoise(0.06, 0.15);
        this.playTone(1000, 'square', 0.04, 0.08);
    }
    leap() { this.playTone(200, 'sawtooth', 0.15, 0.15); }
    slam() {
        this.playTone(70, 'square', 0.2, 0.3);
        this.playNoise(0.15, 0.25);
    }
    screech() { this.playTone(1400, 'sawtooth', 0.2, 0.12); }
    gun() {
        this.playNoise(0.05, 0.2);
        this.playTone(300, 'square', 0.05, 0.1);
    }
    death() {
        this.playTone(400, 'sawtooth', 0.15, 0.2);
        setTimeout(() => this.playTone(300, 'sawtooth', 0.15, 0.2), 120);
        setTimeout(() => this.playTone(200, 'sawtooth', 0.3, 0.2), 240);
    }
    oneUp() {
        [660, 880, 1320].forEach((f, i) => setTimeout(() => this.playTone(f, 'square', 0.12, 0.15), i * 90));
    }
}

const audio = new SoundController();

// --- Chinese-style BGM (synthesized with Web Audio: pentatonic scales, plucked strings, erhu, drums, gong) ---
const BGM_THEMES = [null,
    { root: 62, scale: [0, 2, 4, 7, 9],  bpm: 104, mel: 0 },  // 1: D, bright pentatonic
    { root: 57, scale: [0, 3, 5, 7, 10], bpm: 92,  mel: 1 },  // 2: A, eerie minor pentatonic
    { root: 67, scale: [0, 2, 4, 7, 9],  bpm: 112, mel: 2 },  // 3: G, bold and festive
    { root: 64, scale: [0, 2, 5, 7, 9],  bpm: 108, mel: 2 },  // 4: E, open canyon
    { root: 62, scale: [0, 3, 5, 7, 10], bpm: 120, mel: 1 },  // 5: D, tense minor pentatonic
];

// 4 bars x 8 eighth-notes. Numbers are scale degrees (0-4 = first octave, 5-9 = next), null = rest
const BGM_MELODIES = [
    [4,null,5,7, 9,null,7,5,   4,null,2,null, 4,null,null,null,   2,null,4,5, 7,null,9,7,   5,null,4,2, 0,null,null,null],
    [0,null,null,2, 4,null,2,null,   3,null,2,null, 0,null,null,null,   0,null,2,4, 5,null,4,2,   3,2,0,null, 2,null,null,null],
    [7,null,7,5, 4,null,5,7,   9,null,7,null, 5,null,4,null,   2,null,4,null, 5,7,5,4,   2,null,0,null, 2,null,null,null],
];

class Bgm {
    constructor() {
        this.running = false;
        this.muted = false;
        this.intense = false;      // boss fight: faster, heavier drums
        this.master = null;
        this.theme = BGM_THEMES[1];
        this.step = 0;
        this.nextTime = 0;
    }

    get ac() { return audio.ctx; }

    setStage(n) { this.theme = BGM_THEMES[n] || BGM_THEMES[1]; this.intense = false; }
    setIntense(v) { this.intense = v; }

    ensure() {
        const ac = this.ac;
        if (!ac) return false;
        if (!this.master) {
            this.master = ac.createGain();
            this.master.gain.value = this.muted ? 0 : 0.3;
            this.master.connect(ac.destination);
        }
        return true;
    }

    start() {
        if (!this.ensure()) return;
        this.running = true;
        this.step = 0;
        this.nextTime = this.ac.currentTime + 0.15;
    }

    stop() { this.running = false; }

    toggleMute() {
        this.muted = !this.muted;
        if (this.master) this.master.gain.value = this.muted ? 0 : 0.3;
    }

    eighth() { return 60 / (this.theme.bpm * (this.intense ? 1.22 : 1)) / 2; }

    freq(deg) {
        const t = this.theme;
        const i = ((deg % 5) + 5) % 5;
        const oct = Math.floor(deg / 5);
        return 440 * Math.pow(2, (t.root + t.scale[i] + 12 * oct - 69) / 12);
    }

    // Called every frame: schedules the next notes a little ahead of time
    tick() {
        if (!this.running || !this.ensure()) return;
        const ac = this.ac;
        if (this.nextTime < ac.currentTime - 0.1) this.nextTime = ac.currentTime + 0.05; // after a long pause
        while (this.nextTime < ac.currentTime + 0.25) {
            this.playStep(this.step, this.nextTime);
            this.nextTime += this.eighth();
            this.step = (this.step + 1) % 32;
        }
    }

    playStep(step, t) {
        const bar = Math.floor(step / 8), s = step % 8;
        const mel = BGM_MELODIES[this.theme.mel];

        // Lead: plucked zither (guzheng) with a little slide into notes that follow a rest
        const d = mel[step];
        if (d !== null && d !== undefined) {
            this.pluck(this.freq(d), t, 0.35, 0.55, mel[(step + 31) % 32] === null);
        }
        // Low arpeggio
        if (s % 2 === 0 || this.intense) {
            const arp = [0, 2, 4, 2, 0, 2, 4, 2][s] + [0, 2, -1, 0][bar] - 5;
            this.pluck(this.freq(arp), t, this.intense ? 0.14 : 0.1, 0.3, false);
        }
        // Bass notes
        if (s === 0) this.pluck(this.freq(-10), t, 0.22, 0.8, false);
        if (s === 4) this.pluck(this.freq(-7), t, 0.2, 0.7, false);
        // Erhu: a long singing note at the start of every bar
        if (s === 0) this.erhu(this.freq([7, 5, 9, 4][bar]), t, 6 * this.eighth(), 0.1);
        // Percussion
        const drumSteps = this.intense ? [0, 2, 4, 6] : [0, 4];
        if (drumSteps.includes(s)) this.drum(t, s === 0 ? 0.5 : 0.35);
        if (s % 2 === 1) this.wood(t, this.intense ? 0.12 : 0.08);
        if (s === 0 && (bar === 0 || (this.intense && bar === 2))) this.gong(t, 0.28);
    }

    pluck(freq, t, vol, dur, slide) {
        const ac = this.ac;
        const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
        o.type = 'sawtooth';
        if (slide) {
            o.frequency.setValueAtTime(freq * 0.89, t);
            o.frequency.exponentialRampToValueAtTime(freq, t + 0.05);
        } else {
            o.frequency.setValueAtTime(freq, t);
        }
        f.type = 'lowpass';
        f.frequency.setValueAtTime(Math.min(freq * 6, 9000), t);
        f.frequency.exponentialRampToValueAtTime(freq * 1.5, t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(f); f.connect(g); g.connect(this.master);
        o.start(t); o.stop(t + dur + 0.05);
    }

    erhu(freq, t, dur, vol) {
        const ac = this.ac;
        const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
        const lfo = ac.createOscillator(), lg = ac.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(freq * 0.97, t);
        o.frequency.exponentialRampToValueAtTime(freq, t + 0.12);
        lfo.frequency.value = 5.5;                  // vibrato
        lg.gain.value = freq * 0.012;
        lfo.connect(lg); lg.connect(o.frequency);
        f.type = 'lowpass';
        f.frequency.value = 1800;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.1);
        g.gain.setValueAtTime(vol, t + dur * 0.7);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(f); f.connect(g); g.connect(this.master);
        o.start(t); lfo.start(t);
        o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);
    }

    drum(t, vol) {
        const ac = this.ac;
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(160, t);
        o.frequency.exponentialRampToValueAtTime(45, t + 0.15);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
        o.connect(g); g.connect(this.master);
        o.start(t); o.stop(t + 0.25);
    }

    wood(t, vol) {
        const ac = this.ac;
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(1200, t);
        o.frequency.exponentialRampToValueAtTime(800, t + 0.04);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
        o.connect(g); g.connect(this.master);
        o.start(t); o.stop(t + 0.08);
    }

    gong(t, vol) {
        const ac = this.ac;
        [1, 1.47, 2.04, 2.74].forEach((m, i) => {
            const o = ac.createOscillator(), g = ac.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(160 * m, t);
            g.gain.setValueAtTime(vol / (i + 1), t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
            o.connect(g); g.connect(this.master);
            o.start(t); o.stop(t + 1.9);
        });
    }

    // Short fanfare (win) or sad fall (lose) when a stage ends
    jingle(win) {
        if (!this.ensure()) return;
        const t0 = this.ac.currentTime + 0.05;
        const degs = win ? [0, 1, 2, 3, 4, 5, 7] : [4, 3, 2, 1, 0, -3];
        degs.forEach((d, i) => this.pluck(this.freq(d), t0 + i * (win ? 0.14 : 0.3), 0.35, win ? 0.6 : 0.8, !win));
    }
}

const bgm = new Bgm();

// --- Game Engine Variables ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const CANVAS_WIDTH = 800;
const CANVAS_HEIGHT = 450;
const FLOOR_Y = 360;

let gameState = 'START'; // START, PLAYING, GAMEOVER, CLEAR
let score = 0;
let cameraX = 0;

// Lives: you can die START_LIVES times and keep playing; the next death is Game Over
const START_LIVES = 3;
const EXTEND_SCORE = 10000; // extra life every 10,000 points
let lives = START_LIVES;
let nextExtend = EXTEND_SCORE;
let msgText = '';
let msgTimer = 0;
let lastState = 'START';
let popups = [];
const STAGE_LENGTH = 3000;

// Input Handling
const keys = {
    left: false,
    right: false,
    up: false,
    down: false,
    punch: false,
    kick: false,
    jump: false
};

let lastKickTime = [];

// Player Object
const player = {
    x: 100,
    y: FLOOR_Y,
    vx: 0,
    vy: 0,
    width: 40,
    height: 70,
    facing: 'right',
    isGrounded: true,
    isCrouching: false,
    isAttacking: false,
    attackType: null, // 'punch', 'kick', 'tornado', 'shoryuken'
    attackTimer: 0,
    grabbedBy: [],
    escapeProgress: 0,
    walkTime: 0,
    hurtTimer: 0, // invulnerable/blinking frames after being hit by poop
    attackId: 0,  // increments on every new attack (so a boss is hit once per attack)
    knives: 0,    // knives currently held
    hp: 100,
    maxHp: 100,

    reset() {
        this.walkTime = 0;
        this.hurtTimer = 0;
        this.knives = 0;
        resetExtras();
        this.x = 100;
        this.y = FLOOR_Y;
        this.vx = 0;
        this.vy = 0;
        this.facing = 'right';
        this.isGrounded = true;
        this.isCrouching = false;
        this.isAttacking = false;
        this.attackType = null;
        this.attackTimer = 0;
        this.grabbedBy = [];
        this.escapeProgress = 0;
        this.hp = 100;
    },

    update() {
        if (this.hurtTimer > 0) this.hurtTimer--;

        // Handle Grabbed State (Cannot move normally)
        if (this.grabbedBy.length > 0) {
            this.vx = 0;
            this.isAttacking = false;
            this.hp -= 0.05 * this.grabbedBy.length;
            if (this.hp <= 0) killPlayer();
            return;
        }

        // Jumping / Gravity
        if (!this.isGrounded) {
            this.vy += 0.8; // Gravity
            this.y += this.vy;
            if (this.y >= FLOOR_Y) {
                this.y = FLOOR_Y;
                this.vy = 0;
                this.isGrounded = true;
                if (this.attackType === 'tornado' || this.attackType === 'shoryuken') {
                    this.isAttacking = false;
                    this.attackType = null;
                }
            }
        }

        // Attack Timer Update
        if (this.isAttacking) {
            this.attackTimer--;
            if (this.attackType === 'tornado') {
                this.vx = this.facing === 'right' ? 3 : -3;
            } else if (this.attackType === 'shoryuken') {
                checkHit('shoryuken'); // keep hitting while rising (reaches bats)
            }
            if (this.attackTimer <= 0) {
                this.isAttacking = false;
                this.attackType = null;
            }
        }

        // Movement Movement (If not attacking/locked)
        if (!this.isAttacking) {
            if (keys.down && this.isGrounded) {
                this.isCrouching = true;
                this.vx = 0;
            } else {
                this.isCrouching = false;
                if (keys.left) {
                    this.vx = -3.5;
                    this.facing = 'left';
                } else if (keys.right) {
                    this.vx = 3.5;
                    this.facing = 'right';
                } else {
                    this.vx = 0;
                }
            }

            // Jump
            if (keys.jump && this.isGrounded) {
                this.vy = -13;
                this.isGrounded = false;
            }
        }

        this.x += this.vx;

        // Walk animation timer (only while walking on the ground)
        if (this.isGrounded && !this.isAttacking && !this.isCrouching && this.vx !== 0) {
            this.walkTime += 0.22;
        } else {
            this.walkTime = 0;
        }

        // Boundaries
        if (this.x < cameraX) this.x = cameraX;
        if (this.x > cameraX + CANVAS_WIDTH - this.width) this.x = cameraX + CANVAS_WIDTH - this.width;

        // Keep Camera Scrolling Forward
        if (this.x - cameraX > CANVAS_WIDTH * 0.5 && cameraX < STAGE_LENGTH - CANVAS_WIDTH) {
            cameraX = this.x - CANVAS_WIDTH * 0.5;
        }
        cameraX = Math.min(cameraX, STAGE_LENGTH - CANVAS_WIDTH);
    },

    draw() {
        // Blink while invulnerable after being hit
        if (this.hurtTimer > 0 && Math.floor(this.hurtTimer / 3) % 2 === 0) return;

        ctx.save();
        ctx.translate(this.x - cameraX, this.y);

        const isRight = this.facing === 'right';
        const dir = isRight ? 1 : -1;

        // --- SPECIAL ATTACK: Tornado Kick ---
        if (this.attackType === 'tornado') {
            ctx.fillStyle = 'rgba(30, 144, 255, 0.4)';
            ctx.beginPath();
            ctx.ellipse(this.width / 2, -this.height / 2, 50, 35, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();

            // Spinning Player Sprite
            ctx.save();
            ctx.translate(this.width / 2, -this.height / 2);
            ctx.rotate((35 - this.attackTimer) * 0.5);
            
            // Gi Body
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-15, -20, 30, 40);
            ctx.fillStyle = '#ffcc99';
            ctx.fillRect(-10, -35, 20, 15);
            // Kicking Legs Out
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-35, -5, 70, 12);
            ctx.restore();

            ctx.restore();
            return;
        }

        // --- SPECIAL ATTACK: Shoryuken ---
        if (this.attackType === 'shoryuken') {
            // Flame aura
            ctx.fillStyle = 'rgba(255, 69, 0, 0.6)';
            ctx.beginPath();
            ctx.arc(this.width / 2, -this.height - 10, 35, 0, Math.PI * 2);
            ctx.fill();

            // Upward extended body
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, -this.height - 30, this.width, this.height);
            // Head
            ctx.fillStyle = '#ffcc99';
            ctx.fillRect(5, -this.height - 48, 30, 18);
            // Upward Punch Arm
            ctx.fillStyle = '#ffcc99';
            ctx.fillRect(isRight ? 20 : -10, -this.height - 65, 18, 35);

            ctx.restore();
            return;
        }

        // --- NORMAL / CROUCHING / ATTACKING SPRITE ---
        let baseHeight = this.isCrouching ? this.height * 0.6 : this.height;
        let topY = -baseHeight;

        // --- Walk animation parameters ---
        const walking = this.isGrounded && !this.isAttacking && !this.isCrouching && this.walkTime > 0;
        const ws = Math.sin(this.walkTime);
        const wc = Math.cos(this.walkTime);
        const bob = walking ? Math.round(Math.abs(ws) * 2) : 0;           // body bounce
        const legAx = walking ? Math.round(wc * 7) : 0;                    // leg A stride
        const legBx = -legAx;                                              // leg B stride (opposite)
        const liftA = walking ? Math.round(Math.max(0, ws) * 7) : 0;       // leg A foot lift
        const liftB = walking ? Math.round(Math.max(0, -ws) * 7) : 0;      // leg B foot lift
        const armSwing = -legAx;                                           // arms swing opposite to legs
        const ubY = topY - bob;                                            // upper body Y (bounces)

        // Legs (Gi Pants & Shoes)
        ctx.fillStyle = '#ffffff'; // White pants
        if (this.isCrouching) {
            ctx.fillRect(2, topY + baseHeight - 15, 36, 15);
            ctx.fillStyle = '#8b4513'; // Shoes
            ctx.fillRect(isRight ? 20 : -5, topY + baseHeight - 8, 20, 8);
        } else {
            ctx.fillRect(4 + legAx, topY + 35, 14, 28 - liftA);
            ctx.fillRect(22 + legBx, topY + 35, 14, 28 - liftB);
            ctx.fillStyle = '#8b4513';
            ctx.fillRect(2 + legAx, topY + 58 - liftA, 16, 12);
            ctx.fillRect(22 + legBx, topY + 58 - liftB, 16, 12);
        }

        // Back arm (only while walking, drawn behind the torso)
        if (walking) {
            ctx.fillStyle = '#d9a877';
            ctx.fillRect((isRight ? 4 : 24) - armSwing, ubY + 16, 10, 16);
        }

        // Torso (Gi)
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(4, ubY + 12, 32, this.isCrouching ? 22 : 26);

        // Black Belt
        ctx.fillStyle = '#111111';
        ctx.fillRect(3, ubY + (this.isCrouching ? 24 : 32), 34, 5);

        // Head & Hair
        ctx.fillStyle = '#ffcc99'; // Skin
        ctx.fillRect(8, ubY - 14, 24, 20);
        ctx.fillStyle = '#221100'; // Black Hair
        ctx.fillRect(6, ubY - 20, 28, 8);
        ctx.fillRect(isRight ? 22 : 6, ubY - 14, 8, 12); // Sideburns
        ctx.fillStyle = '#cc0000'; // Red Headband
        ctx.fillRect(6, ubY - 12, 28, 4);

        // Arms & Attacks
        ctx.fillStyle = '#ffcc99';
        if (this.isAttacking && (this.attackType === 'punch' || this.attackType === 'throw')) {
            // Extended Punch Arm
            let armX = isRight ? 25 : -25;
            let armY = topY + 14;
            ctx.fillRect(armX, armY, 30, 10);
            ctx.fillStyle = '#cc0000'; // Red Hand Wrap
            ctx.fillRect(isRight ? 50 : -25, armY, 8, 10);
        } else if (this.isAttacking && this.attackType === 'kick') {
            // Extended Kick Leg
            ctx.fillStyle = '#ffffff';
            let legX = isRight ? 25 : -30;
            let legY = this.isCrouching ? topY + 15 : topY + 28;
            ctx.fillRect(legX, legY, 35, 12);
            ctx.fillStyle = '#8b4513'; // Shoe
            ctx.fillRect(isRight ? 52 : -30, legY, 10, 12);
        } else {
            // Idle / Walking Arms (front arm swings while walking)
            ctx.fillRect((isRight ? 24 : 4) + armSwing, ubY + 16, 10, 16);
        }

        ctx.restore();
    }
};

// --- Enemy System ---
class Gripper {
    constructor(x) {
        this.x = x;
        this.y = FLOOR_Y;
        this.width = 35;
        this.height = 65;
        this.kind = 'grunt';
        this.points = 100;
        this.vx = stageCfg().grunt.speed;
        this.isGrabbing = false;
        this.hp = 1;
        this.active = true;
        this.walkTime = Math.random() * Math.PI * 2; // desync enemies' strides
    }

    update() {
        if (!this.active) return;

        if (this.isGrabbing) {
            this.x = player.x + (player.facing === 'right' ? -15 : 15);
            return;
        }

        // Walk animation timer
        this.walkTime += 0.2;

        // Walk towards Player
        if (this.x < player.x) {
            this.x += this.vx;
        } else {
            this.x -= this.vx;
        }

        // Grab Player Detection
        if (Math.abs(this.x - player.x) < 25 && player.isGrounded && player.hurtTimer <= 0 && player.attackType !== 'tornado' && player.attackType !== 'shoryuken') {
            this.isGrabbing = true;
            if (!player.grabbedBy.includes(this)) {
                player.grabbedBy.push(this);
                audio.grab();
            }
        }
    }

    draw() {
        if (!this.active) return;
        ctx.save();
        ctx.translate(this.x - cameraX, this.y);

        const facingRight = player.x > this.x;
        const topY = -this.height;

        // Walk animation parameters (standing still while grabbing)
        const walking = !this.isGrabbing;
        const ws = Math.sin(this.walkTime);
        const wc = Math.cos(this.walkTime);
        const bob = walking ? Math.round(Math.abs(ws)) : 0;
        const legAx = walking ? Math.round(wc * 6) : 0;
        const legBx = -legAx;
        const liftA = walking ? Math.round(Math.max(0, ws) * 6) : 0;
        const liftB = walking ? Math.round(Math.max(0, -ws) * 6) : 0;
        const armSwing = -legAx;
        const ubY = topY - bob;

        // Enemy Clothes (Purple Sleeveless Top & Pants)
        ctx.fillStyle = '#4b0082'; // Purple Pants
        ctx.fillRect(4 + legAx, topY + 35, 12, 25 - liftA);
        ctx.fillRect(19 + legBx, topY + 35, 12, 25 - liftB);

        ctx.fillStyle = '#8a2be2'; // Purple Shirt
        ctx.fillRect(4, ubY + 14, 27, 22 + bob);

        // Bare Arms / Skin
        ctx.fillStyle = '#ffcc99';
        if (this.isGrabbing) {
            // Reaching Arms Forward (Grabbing)
            ctx.fillRect(facingRight ? 20 : -15, ubY + 16, 25, 8);
        } else {
            ctx.fillRect(2 + armSwing, ubY + 16, 6, 18);
            ctx.fillRect(27 - armSwing, ubY + 16, 6, 18);
        }

        // Head & Face
        ctx.fillRect(6, ubY - 10, 22, 20);
        ctx.fillStyle = '#111'; // Short Hair
        ctx.fillRect(4, ubY - 14, 26, 8);

        // Shoes
        ctx.fillStyle = '#222';
        ctx.fillRect(2 + legAx, topY + 58 - liftA, 14, 7);
        ctx.fillRect(19 + legBx, topY + 58 - liftB, 14, 7);

        ctx.restore();
    }
}

let enemies = [];

// --- Bat (flying enemy) & Poop (its attack) ---
class Bat {
    constructor(x, dir) {
        this.isBat = true;
        this.points = 200;
        this.x = x;
        this.width = 36;
        this.height = 22;
        this.baseY = 195 + Math.random() * 30;
        this.y = this.baseY;            // bottom of hit box (same convention as other enemies)
        this.dir = dir;                 // 1 = flying right, -1 = flying left
        this.speed = 2.4;
        this.flapTime = Math.random() * Math.PI * 2;
        this.bobTime = Math.random() * Math.PI * 2;
        this.dropCooldown = 40;
        this.active = true;
    }

    update() {
        if (!this.active) return;

        this.flapTime += 0.45;
        this.bobTime += 0.06;
        this.x += this.dir * this.speed;
        this.y = this.baseY + Math.sin(this.bobTime) * 12;

        // Turn around off-screen so the bat keeps coming back
        if (this.dir === 1 && this.x > cameraX + CANVAS_WIDTH + 60) this.dir = -1;
        if (this.dir === -1 && this.x < cameraX - 100) this.dir = 1;

        // Poop attack: drop when roughly above the player (or occasionally at random)
        if (this.dropCooldown > 0) this.dropCooldown--;
        const onScreen = this.x > cameraX && this.x + this.width < cameraX + CANVAS_WIDTH;
        if (onScreen && this.dropCooldown <= 0) {
            const dx = (this.x + this.width / 2) - (player.x + player.width / 2);
            if (Math.abs(dx) < 24 || Math.random() < 0.004) {
                poops.push(new Poop(this.x + this.width / 2, this.y));
                this.dropCooldown = 110;
                audio.drop();
            }
        }
    }

    draw() {
        if (!this.active) return;
        ctx.save();
        ctx.translate(this.x - cameraX, this.y);

        const cx = this.width / 2;
        const cy = -this.height / 2;
        const tip = Math.round(Math.sin(this.flapTime) * 11); // wing flap

        // Wings
        ctx.fillStyle = '#3d1f63';
        [-1, 1].forEach(side => {
            ctx.beginPath();
            ctx.moveTo(cx + side * 5, cy - 3);
            ctx.lineTo(cx + side * 27, cy - 4 - tip);
            ctx.lineTo(cx + side * 22, cy + 2 - tip * 0.5);
            ctx.lineTo(cx + side * 16, cy + 6 - tip * 0.25);
            ctx.lineTo(cx + side * 10, cy + 4);
            ctx.lineTo(cx + side * 5, cy + 5);
            ctx.closePath();
            ctx.fill();
        });

        // Body & ears
        ctx.fillStyle = '#1c1028';
        ctx.fillRect(cx - 6, cy - 6, 12, 13);
        ctx.fillRect(cx - 6, cy - 10, 4, 5);
        ctx.fillRect(cx + 2, cy - 10, 4, 5);

        // Eyes & fangs
        ctx.fillStyle = '#ff2222';
        ctx.fillRect(cx - 4, cy - 3, 3, 3);
        ctx.fillRect(cx + 1, cy - 3, 3, 3);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(cx - 3, cy + 3, 2, 3);
        ctx.fillRect(cx + 1, cy + 3, 2, 3);

        ctx.restore();
    }
}

class Poop {
    constructor(x, y) {
        this.x = x;        // center X (world)
        this.y = y;        // bottom Y
        this.vy = 0;
        this.w = 14;
        this.h = 16;
        this.landed = false;
        this.timer = 40;   // frames the splat stays on the floor
        this.active = true;
    }

    update() {
        if (!this.active) return;

        if (this.landed) {
            if (--this.timer <= 0) this.active = false;
            return;
        }

        this.vy = Math.min(this.vy + 0.3, 7);
        this.y += this.vy;

        // Hit the player (not while blinking after a previous hit)
        if (player.hurtTimer <= 0 &&
            this.x - this.w / 2 < player.x + player.width &&
            this.x + this.w / 2 > player.x &&
            this.y > player.y - player.height &&
            this.y - this.h < player.y) {
            this.active = false;
            player.hp -= 12;
            player.hurtTimer = 45;
            audio.splat();
            if (player.hp <= 0) killPlayer();
            return;
        }

        // Landed on the floor
        if (this.y >= FLOOR_Y) {
            this.y = FLOOR_Y;
            this.landed = true;
            audio.splat();
        }
    }

    draw() {
        if (!this.active) return;
        ctx.save();
        ctx.translate(this.x - cameraX, this.y);
        if (this.landed) {
            // Flat splat
            ctx.fillStyle = '#6b4220';
            ctx.fillRect(-12, -4, 24, 4);
            ctx.fillStyle = '#8b5a2b';
            ctx.fillRect(-8, -7, 16, 3);
        } else {
            // Classic swirl: three stacked blobs
            ctx.fillStyle = '#8b5a2b';
            ctx.fillRect(-7, -6, 14, 6);
            ctx.fillRect(-5, -11, 10, 5);
            ctx.fillRect(-3, -16, 6, 5);
            ctx.fillStyle = '#b07a45';
            ctx.fillRect(-5, -5, 3, 2);
            ctx.fillRect(-3, -10, 3, 2);
        }
        ctx.restore();
    }
}

let bats = [];
let poops = [];
let bullets = []; // bullets, feathers and ground shock waves
let spawnT = { grunt: 0, bat: 0, sumo: 0, condor: 0, rat: 0 };

function resetExtras() {
    bats = [];
    poops = [];
    bullets = [];
    spawnT = { grunt: 0, bat: 0, sumo: 0, condor: 0, rat: 0 };
    knifeItems = [];
    thrownKnives = [];
    popups = [];
    msgTimer = 0;
    boss = null;
    bossWarning = 0;
}

// --- Knives, Boss & shared helpers ---
const MAX_KNIVES = 99;
const KNIFE_DROP_RATE = 0.3; // chance that a defeated enemy drops a knife
const HIT_DAMAGE = { punch: 2, kick: 3, tornado: 4, shoryuken: 6 }; // damage vs boss
let knifeItems = [];   // knives lying on the ground
let thrownKnives = []; // knives in flight
let boss = null;
let bossWarning = 0;

// Right-facing knife, origin at the handle's left end, vertically centered
function drawKnifeShape() {
    ctx.fillStyle = '#8b4513'; ctx.fillRect(0, -3, 7, 6);    // handle
    ctx.fillStyle = '#ffd700'; ctx.fillRect(7, -5, 2, 10);   // guard
    ctx.fillStyle = '#e0e0e0'; ctx.fillRect(9, -2, 11, 4);   // blade
    ctx.fillRect(20, -1, 3, 2);                               // tip
    ctx.fillStyle = '#ffffff'; ctx.fillRect(9, -2, 11, 1);   // edge highlight
}

function addPopup(x, y, text) {
    popups.push({ x, y, text, t: 45 });
}

function drawPopups() {
    ctx.font = 'bold 18px "Courier New"';
    ctx.textAlign = 'center';
    popups.forEach(p => {
        ctx.globalAlpha = Math.min(1, p.t / 15);
        ctx.fillStyle = '#000000';
        ctx.fillText(p.text, p.x - cameraX + 1, p.y + 1);
        ctx.fillStyle = '#ffee66';
        ctx.fillText(p.text, p.x - cameraX, p.y);
    });
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
}

function showMsg(text, frames) {
    msgText = text;
    msgTimer = frames;
}

// Out of HP: lose a life and respawn on the spot, or game over when none are left
function killPlayer() {
    player.hp = 0;
    if (lives > 0) {
        lives--;
        audio.death();
        player.hp = player.maxHp;
        player.hurtTimer = 150; // invincible (blinking) for a moment
        player.grabbedBy.forEach(e => e.active = false);
        player.grabbedBy = [];
        player.vx = 0; player.vy = 0;
        player.y = FLOOR_Y;
        player.isGrounded = true;
        player.isCrouching = false;
        player.isAttacking = false;
        player.attackType = null;
        poops = [];
        bullets = [];
        showMsg(`MISS!  LIVES x${lives}`, 100);
    } else {
        gameState = 'GAMEOVER';
    }
}

function hurtPlayer(dmg, fromX) {
    player.hp -= dmg;
    player.hurtTimer = 45;
    audio.splat();
    if (fromX !== undefined) {
        player.x += (player.x + player.width / 2 < fromX ? -1 : 1) * 14; // knockback
    }
    if (player.hp <= 0) killPlayer();
}

function dropKnife(e) {
    knifeItems.push(new KnifeItem(e.x + e.width / 2 - 11, e.y));
}

// Damage/kill a target (grunt, bat or boss)
function hitTarget(e, dmg, hitId) {
    if (e.isBoss) {
        e.takeHit(dmg, hitId);
        return;
    }
    if (e.hp > 1) { // tougher enemies (sumo, condor, rat) take several hits
        if (hitId !== undefined) {
            if (e.lastHitId === hitId) return;
            e.lastHitId = hitId;
        }
        e.hp -= dmg;
        e.flash = 10;
        audio.hit();
        if (e.hp > 0) {
            score += 20;
            return;
        }
    }
    e.active = false;
    if (e.isGrabbing) {
        player.grabbedBy = player.grabbedBy.filter(g => g !== e);
    }
    const pts = e.points || (e.isBat ? 200 : 100);
    score += pts;
    addPopup(e.x + e.width / 2, e.y - e.height, '+' + pts);
    audio.hit();
    if (Math.random() < KNIFE_DROP_RATE) dropKnife(e); // 30% chance to drop a knife
}

function throwKnife() {
    if (player.isAttacking || player.knives <= 0) return;
    if (keys.left) player.facing = 'left';
    else if (keys.right) player.facing = 'right';
    const dir = player.facing === 'right' ? 1 : -1;
    const kx = dir === 1 ? player.x + player.width : player.x - 23;
    const ky = player.isCrouching ? player.y - 24 : player.y - 48;
    thrownKnives.push(new ThrownKnife(kx, ky, dir));
    player.knives--;
    player.isAttacking = true;
    player.attackType = 'throw';
    player.attackTimer = 10;
    if (player.isGrounded) player.vx = 0;
    audio.throwKnife();
}

function createBoss(x) {
    switch (stageCfg().boss) {
        case 'bat': return new BatBoss(x);
        case 'sumo': return new SumoBoss(x);
        case 'condor': return new CondorBoss(x);
        case 'rat': return new RatBoss(x);
        default: return new Boss(x);
    }
}

function startBoss() {
    boss = createBoss(cameraX + CANVAS_WIDTH + 40);
    bossWarning = 120;
    bgm.setIntense(true); // faster, heavier music for the boss
}

class KnifeItem {
    constructor(x, y) {
        this.x = x;
        this.y = y;        // bottom
        this.vy = -3;      // small pop-up when dropped
        this.w = 23;
        this.h = 10;
        this.landed = false;
        this.life = 600;   // ~10 seconds on the floor
        this.t = 0;
        this.active = true;
    }

    update() {
        this.t++;
        if (!this.landed) {
            this.vy = Math.min(this.vy + 0.4, 8);
            this.y += this.vy;
            if (this.y >= FLOOR_Y) {
                this.y = FLOOR_Y;
                this.landed = true;
            }
        } else if (--this.life <= 0) {
            this.active = false;
            return;
        }

        // Pick up by touching it
        if (player.knives < MAX_KNIVES &&
            this.x < player.x + player.width && this.x + this.w > player.x &&
            this.y > player.y - player.height && this.y - this.h < player.y) {
            player.knives++;
            this.active = false;
            audio.pickup();
        }
    }

    draw() {
        if (this.life < 120 && Math.floor(this.life / 6) % 2 === 0) return; // blink before vanishing
        const hover = this.landed ? Math.round(Math.sin(this.t * 0.12) * 2) : 0;
        ctx.save();
        ctx.translate(this.x - cameraX, this.y - 7 + hover);
        drawKnifeShape();
        if (Math.floor(this.t / 20) % 2 === 0) { // sparkle
            ctx.fillStyle = '#ffff99';
            ctx.fillRect(12, -13, 2, 6);
            ctx.fillRect(10, -11, 6, 2);
        }
        ctx.restore();
    }
}

class ThrownKnife {
    constructor(x, y, dir) {
        this.x = x;
        this.y = y;   // vertical center
        this.dir = dir;
        this.w = 23;
        this.speed = 10;
        this.active = true;
    }

    update() {
        this.x += this.dir * this.speed;
        if (this.x < cameraX - 60 || this.x > cameraX + CANVAS_WIDTH + 60) {
            this.active = false;
            return;
        }
        const targets = [...enemies, ...bats, ...(boss ? [boss] : [])];
        for (const e of targets) {
            if (!e.active) continue;
            if (this.x < e.x + e.width && this.x + this.w > e.x &&
                this.y + 4 > e.y - e.height && this.y - 4 < e.y) {
                hitTarget(e, 3);
                this.active = false;
                break;
            }
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x - cameraX + (this.dir < 0 ? this.w : 0), this.y);
        ctx.scale(this.dir, 1);
        drawKnifeShape();
        ctx.restore();
    }
}

class Boss {
    constructor(x) {
        this.isBoss = true;
        this.name = 'ONI SHOGUN';
        this.points = 1000 * stage; // boss bonus grows with the stage
        this.noKnockback = false;
        this.x = x;
        this.y = FLOOR_Y;
        this.width = 60;
        this.height = 100;
        this.hp = 40;
        this.maxHp = 40;
        this.state = 'enter';   // enter, idle, windup, attack, recover
        this.kind = null;       // 'melee' | 'charge'
        this.timer = 0;
        this.cooldown = 40;
        this.facing = 'left';
        this.dashDir = -1;
        this.hitDone = false;
        this.walkTime = 0;
        this.flash = 0;
        this.lastHitId = null;
        this.deathTimer = 0;
        this.dead = false;
        this.active = true;
    }

    takeHit(dmg, hitId) {
        if (this.dead) return;
        if (hitId !== undefined) {           // one hit per attack (e.g. multi-frame Shoryuken)
            if (hitId === this.lastHitId) return;
            this.lastHitId = hitId;
        }
        this.hp -= dmg;
        this.flash = 12;
        score += 50;
        audio.hit();
        if (!this.noKnockback && this.state !== 'attack') {
            this.x += (player.x < this.x ? 1 : -1) * 5; // tiny knockback
        }
        if (this.hp <= 0) {
            this.hp = 0;
            this.dead = true;
            this.active = false;
            this.deathTimer = 0;
            score += this.points;
            addPopup(this.x + this.width / 2, this.y - this.height, '+' + this.points);
        }
    }

    // Shared by the other bosses: advance the death animation, clear the stage when it ends
    tickDead() {
        if (!this.dead) return false;
        this.deathTimer++;
        if (this.y < FLOOR_Y) this.y = Math.min(FLOOR_Y, this.y + 6); // flying bosses fall
        if (this.deathTimer > 150 && gameState === 'PLAYING') gameState = 'CLEAR';
        return true;
    }

    startAttack(kind, frames) {
        this.state = 'windup';
        this.kind = kind;
        this.timer = frames;
    }

    tryHitPlayer() {
        if (this.hitDone || player.hurtTimer > 0) return;
        const px1 = player.x, px2 = player.x + player.width;
        const py1 = player.y - player.height, py2 = player.y;
        let hit;
        if (this.kind === 'melee') {
            const hx1 = this.facing === 'right' ? this.x + this.width : this.x - 50;
            const hx2 = hx1 + 50;
            const hy1 = this.y - this.height + 15, hy2 = hy1 + 45;
            hit = px1 < hx2 && px2 > hx1 && py1 < hy2 && py2 > hy1;
        } else {
            hit = px1 < this.x + this.width && px2 > this.x && py1 < this.y && py2 > this.y - this.height;
        }
        if (hit) {
            this.hitDone = true;
            hurtPlayer(this.kind === 'melee' ? 15 : 18, this.x + this.width / 2);
        }
    }

    update() {
        if (this.dead) {
            this.deathTimer++;
            if (this.deathTimer > 150 && gameState === 'PLAYING') gameState = 'CLEAR';
            return;
        }
        if (this.flash > 0) this.flash--;

        const pcx = player.x + player.width / 2;
        const bcx = this.x + this.width / 2;
        const dist = Math.abs(pcx - bcx);
        let moving = false;

        if (this.state === 'enter') {
            this.x -= 2;
            moving = true;
            if (this.x <= cameraX + CANVAS_WIDTH - this.width - 80) {
                this.state = 'idle';
                this.cooldown = 40;
            }
        } else if (this.state === 'idle') {
            this.facing = pcx > bcx ? 'right' : 'left';
            const dir = this.facing === 'right' ? 1 : -1;
            if (dist > 70) {
                this.x += dir * 1.3;
                moving = true;
            }
            if (this.cooldown > 0) {
                this.cooldown--;
            } else if (dist < 100) {
                this.startAttack('melee', 24);
            } else if (dist > 170 && Math.random() < 0.02) {
                this.dashDir = dir;
                this.startAttack('charge', 30);
            }
        } else if (this.state === 'windup') {
            if (--this.timer <= 0) {
                this.state = 'attack';
                this.timer = this.kind === 'melee' ? 10 : 28;
                this.hitDone = false;
            }
        } else if (this.state === 'attack') {
            this.timer--;
            if (this.kind === 'charge') {
                this.x += this.dashDir * 7;
                moving = true;
                this.walkTime += 0.35;
            }
            this.tryHitPlayer();
            if (this.timer <= 0) {
                this.state = 'recover';
                this.timer = this.kind === 'melee' ? 30 : 50;
            }
        } else if (this.state === 'recover') {
            if (--this.timer <= 0) {
                this.state = 'idle';
                this.cooldown = 50 + Math.floor(Math.random() * 30);
            }
        }

        if (moving) this.walkTime += 0.14; else this.walkTime = 0;

        if (this.state !== 'enter') {
            this.x = Math.max(cameraX + 4, Math.min(cameraX + CANVAS_WIDTH - this.width - 4, this.x));
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x - cameraX, this.y);

        const right = this.facing === 'right';
        const dir = right ? 1 : -1;
        const flashOn = this.flash > 0 && Math.floor(this.flash / 2) % 2 === 0;
        const C = c => (flashOn ? '#ffffff' : c);
        const topY = -this.height;

        if (this.dead) {
            // Tip over backwards, then blink out
            const p = Math.min(1, this.deathTimer / 40);
            ctx.translate(this.width / 2, 0);
            ctx.rotate(-dir * p * Math.PI / 2);
            ctx.translate(-this.width / 2, 0);
            if (this.deathTimer > 60) ctx.globalAlpha = Math.floor(this.deathTimer / 4) % 2 ? 0.3 : 0.9;
        } else if (this.state === 'attack' && this.kind === 'charge') {
            // Lean into the dash + speed lines
            ctx.translate(this.width / 2, 0);
            ctx.rotate(dir * 0.18);
            ctx.translate(-this.width / 2, 0);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            for (let i = 0; i < 3; i++) {
                ctx.fillRect(right ? -50 - i * 8 : this.width + 10 + i * 8, topY + 30 + i * 22, 40, 3);
            }
        } else if (this.state === 'windup' && this.kind === 'charge') {
            ctx.translate((Math.random() - 0.5) * 3, 0); // shake while charging up
        }

        // Walk animation
        const walking = this.walkTime > 0;
        const ws = Math.sin(this.walkTime);
        const wc = Math.cos(this.walkTime);
        const bob = walking ? Math.round(Math.abs(ws) * 3) : 0;
        const legAx = walking ? Math.round(wc * 9) : 0;
        const legBx = -legAx;
        const liftA = walking ? Math.round(Math.max(0, ws) * 8) : 0;
        const liftB = walking ? Math.round(Math.max(0, -ws) * 8) : 0;
        const ubY = topY - bob;
        const armSwing = -Math.round(legAx / 2);
        const raised = this.state === 'windup' && this.kind === 'melee';
        const strike = this.state === 'attack' && this.kind === 'melee';

        // Legs & boots
        ctx.fillStyle = C('#2a2a3a');
        ctx.fillRect(6 + legAx, topY + 64, 20, 36 - liftA);
        ctx.fillRect(34 + legBx, topY + 64, 20, 36 - liftB);
        ctx.fillStyle = C('#111111');
        ctx.fillRect(4 + legAx, topY + 90 - liftA, 24, 10);
        ctx.fillRect(32 + legBx, topY + 90 - liftB, 24, 10);

        // Back arm
        if (!raised && !strike) {
            ctx.fillStyle = C('#b9824f');
            ctx.fillRect((right ? -2 : 46) + armSwing, ubY + 30, 14, 34);
        }

        // Torso (armor), belt, shoulder pads
        ctx.fillStyle = C('#8b1a1a');
        ctx.fillRect(4, ubY + 24, 52, 44);
        ctx.fillStyle = C('#b22222');
        ctx.fillRect(10, ubY + 28, 40, 14);
        ctx.fillStyle = C('#d4a017');
        ctx.fillRect(4, ubY + 58, 52, 10);
        ctx.fillRect(-2, ubY + 20, 18, 12);
        ctx.fillRect(44, ubY + 20, 18, 12);

        // Head, helmet, horns, face
        ctx.fillStyle = C('#e0a070');
        ctx.fillRect(18, ubY + 2, 24, 22);
        ctx.fillStyle = C('#9aa0a6');
        ctx.fillRect(15, ubY - 8, 30, 14);
        ctx.fillStyle = C('#f5f0d0');
        ctx.fillRect(9, ubY - 18, 6, 14);
        ctx.fillRect(45, ubY - 18, 6, 14);
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(22, ubY + 10, 6, 4);
        ctx.fillRect(32, ubY + 10, 6, 4);
        ctx.fillStyle = '#3a1a0a';
        ctx.fillRect(24, ubY + 18, 12, 3);

        // Front arm
        ctx.fillStyle = C('#e0a070');
        if (strike) {
            ctx.fillRect(right ? 48 : -40, ubY + 34, 52, 14);
            ctx.fillStyle = C('#d4a017');
            ctx.fillRect(right ? 92 : -46, ubY + 30, 14, 22);
        } else if (raised) {
            ctx.fillRect(right ? 44 : 2, ubY - 14, 14, 44);
            ctx.fillStyle = C('#d4a017');
            ctx.fillRect(right ? 42 : 0, ubY - 20, 18, 12);
        } else {
            ctx.fillRect((right ? 46 : -2) - armSwing, ubY + 30, 14, 34);
            ctx.fillStyle = C('#d4a017');
            ctx.fillRect((right ? 46 : -2) - armSwing, ubY + 56, 14, 8);
        }

        // Attack warning mark
        if (this.state === 'windup') {
            ctx.fillStyle = '#ff0000';
            ctx.font = 'bold 30px "Courier New"';
            ctx.fillText('!', this.width / 2 - 8, ubY - 26);
        }

        ctx.restore();
    }
}

// ====================== Stage system ======================
const MAX_STAGE = 5;
let stage = 1;
let stageBanner = 0;
let stateTimer = 0;

const STAGES = [null,
    { name: 'TEMPLE GATE', intro: 'FIGHT YOUR WAY TO THE BOSS!', boss: 'oni',
      grunt: { interval: 130, max: 3, speed: 1.6 } },
    { name: 'MIDNIGHT FOREST', intro: 'BEWARE OF BATS!', boss: 'bat',
      grunt: { interval: 120, max: 3, speed: 1.7 },
      bat: { interval: 260, max: 2 } },
    { name: 'SUMO ARENA', intro: 'FLYING SUMO WRESTLERS!', boss: 'sumo',
      grunt: { interval: 115, max: 4, speed: 1.8 },
      bat: { interval: 280, max: 2 },
      sumo: { interval: 650, max: 1 } },
    { name: 'CONDOR CANYON', intro: 'CONDORS DIVE FROM THE SKY!', boss: 'condor',
      grunt: { interval: 110, max: 4, speed: 1.9 },
      bat: { interval: 280, max: 2 },
      sumo: { interval: 600, max: 1 },
      condor: { interval: 420, max: 1 } },
    { name: 'BACK ALLEY', intro: 'GANG RATS! ATTACK WHILE CROUCHING!', boss: 'rat',
      grunt: { interval: 100, max: 4, speed: 2.0 },
      bat: { interval: 300, max: 2 },
      sumo: { interval: 600, max: 1 },
      condor: { interval: 450, max: 1 },
      rat: { interval: 300, max: 2 } },
];

function stageCfg() { return STAGES[stage]; }

function startNewGame() {
    score = 0;
    stage = 1;
    cameraX = 0;
    enemies = [];
    player.reset(); // also clears knives and every extra
    lives = START_LIVES;
    nextExtend = EXTEND_SCORE;
    gameState = 'PLAYING';
    stageBanner = 150;
    bgm.setStage(stage);
    bgm.start();
}

function nextStage() {
    stage++;
    cameraX = 0;
    enemies = [];
    resetExtras();
    Object.assign(player, {
        x: 100, y: FLOOR_Y, vx: 0, vy: 0, facing: 'right',
        isGrounded: true, isCrouching: false, isAttacking: false,
        attackType: null, attackTimer: 0, grabbedBy: [], hurtTimer: 0
    });
    player.hp = Math.min(player.maxHp, player.hp + 40); // small heal between stages
    gameState = 'PLAYING';
    stageBanner = 150;
    bgm.setStage(stage);
    bgm.start();
}

// Called when the player presses a button on the title / game over / clear screens
function handleStartPress() {
    if ((gameState === 'GAMEOVER' || gameState === 'CLEAR') && stateTimer < 45) return;
    if (gameState === 'CLEAR' && stage < MAX_STAGE) nextStage();
    else startNewGame();
}

// Spawns every enemy type that the current stage allows
function spawnAll() {
    if (boss) return; // no new enemies during the boss fight
    const cfg = stageCfg();
    const fromRight = () => Math.random() > 0.5;

    if (++spawnT.grunt > cfg.grunt.interval) {
        spawnT.grunt = 0;
        if (enemies.filter(e => e.active && e.kind === 'grunt').length < cfg.grunt.max) {
            const spawnX = cameraX + (fromRight() ? CANVAS_WIDTH + 50 : -50);
            if (spawnX > 0 && spawnX < STAGE_LENGTH) enemies.push(new Gripper(spawnX));
        }
    }
    if (cfg.bat && ++spawnT.bat > cfg.bat.interval) {
        spawnT.bat = 0;
        if (bats.filter(b => b.active).length < cfg.bat.max) {
            const r = fromRight();
            bats.push(new Bat(r ? cameraX + CANVAS_WIDTH + 40 : cameraX - 76, r ? -1 : 1));
        }
    }
    if (cfg.sumo && ++spawnT.sumo > cfg.sumo.interval) {
        spawnT.sumo = 0;
        if (enemies.filter(e => e.active && e.kind === 'sumo').length < cfg.sumo.max) {
            enemies.push(new Sumo(fromRight() ? cameraX + CANVAS_WIDTH + 70 : cameraX - 130));
        }
    }
    if (cfg.condor && ++spawnT.condor > cfg.condor.interval) {
        spawnT.condor = 0;
        if (enemies.filter(e => e.active && e.kind === 'condor').length < cfg.condor.max) {
            enemies.push(new Condor(fromRight() ? cameraX + CANVAS_WIDTH + 40 : cameraX - 100));
        }
    }
    if (cfg.rat && ++spawnT.rat > cfg.rat.interval) {
        spawnT.rat = 0;
        if (enemies.filter(e => e.active && e.kind === 'rat').length < cfg.rat.max) {
            const spawnX = cameraX + (fromRight() ? CANVAS_WIDTH + 40 : -60);
            if (spawnX > 0 && spawnX < STAGE_LENGTH) enemies.push(new GangRat(spawnX));
        }
    }
}

// ====================== Shared helpers for the new enemies ======================
const fcol = (e, c) => (e.flash > 0 && Math.floor(e.flash / 2) % 2 === 0 ? '#ffffff' : c);

function playerTouches(x1, x2, yTop, yBottom) {
    return x1 < player.x + player.width && x2 > player.x &&
           yTop < player.y && yBottom > player.y - player.height;
}

// Bullets (gang rats), feathers (condor boss) and ground shock waves (sumo boss)
class Bullet {
    constructor(x, y, vx, vy, type) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy || 0;
        this.type = type || 'bullet'; // 'bullet' | 'feather' | 'wave'
        this.active = true;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < cameraX - 80 || this.x > cameraX + CANVAS_WIDTH + 80 || this.y > FLOOR_Y + 10 || this.y < -40) {
            this.active = false;
            return;
        }
        if (player.hurtTimer > 0) return;

        let hit = false;
        if (this.type === 'wave') {
            // Only hurts a player standing on the floor: jump over it!
            hit = player.y > FLOOR_Y - 16 && this.x + 14 > player.x && this.x - 14 < player.x + player.width;
        } else if (this.type === 'bullet') {
            // Crouching lets you duck under high shots
            const top = player.isCrouching ? player.y - 40 : player.y - player.height;
            hit = this.x + 5 > player.x && this.x - 5 < player.x + player.width &&
                  this.y + 2 > top && this.y - 2 < player.y;
        } else {
            hit = playerTouches(this.x - 6, this.x + 6, this.y - 6, this.y + 6);
        }
        if (hit) {
            hurtPlayer(this.type === 'wave' ? 12 : this.type === 'bullet' ? 8 : 10, this.x);
            this.active = false;
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x - cameraX, this.y);
        if (this.type === 'bullet') {
            ctx.fillStyle = '#ffe066';
            ctx.fillRect(-6, -2, 12, 4);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-2, -1, 5, 2);
        } else if (this.type === 'wave') {
            ctx.fillStyle = 'rgba(255, 190, 90, 0.85)';
            ctx.beginPath();
            ctx.ellipse(0, 8, 14, 18, 0, Math.PI, 0);
            ctx.fill();
            ctx.fillStyle = 'rgba(255, 245, 200, 0.9)';
            ctx.beginPath();
            ctx.ellipse(0, 8, 8, 10, 0, Math.PI, 0);
            ctx.fill();
        } else {
            ctx.rotate(Math.atan2(this.vy, this.vx));
            ctx.fillStyle = '#5a3a1a';
            ctx.fillRect(-8, -2, 16, 4);
            ctx.fillStyle = '#f0eada';
            ctx.fillRect(4, -2, 4, 4);
        }
        ctx.restore();
    }
}

// ---- Sprites shared by the normal enemy and its boss version ----
// Sumo: origin = center-bottom, faces right
function drawSumoSprite(e, o) {
    const sk = fcol(e, '#e9b58a');
    ctx.fillStyle = sk;
    ctx.fillRect(-24, -18 - o.lift, 18, 18);       // legs (stomp)
    ctx.fillRect(6, -18 - o.lift2, 18, 18);
    ctx.beginPath(); ctx.ellipse(0, -38, 28, 24, 0, 0, Math.PI * 2); ctx.fill(); // belly
    ctx.fillStyle = fcol(e, o.boss ? '#c1272d' : '#2a52be');                       // mawashi
    ctx.fillRect(-26, -32, 52, 12);
    ctx.fillRect(6, -22, 16, 14);
    if (o.boss) {                                                                  // white rope
        ctx.fillStyle = fcol(e, '#ffffff');
        ctx.fillRect(-27, -37, 54, 5);
        ctx.fillRect(14, -34, 4, 14);
    }
    ctx.fillStyle = sk;                                                            // head
    ctx.beginPath(); ctx.ellipse(0, -62, 14, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.fillRect(-12, -72, 24, 6);
    ctx.fillRect(-4, -78, 8, 7);                                                   // topknot
    ctx.fillStyle = '#000';
    ctx.fillRect(2, -64, 4, 3); ctx.fillRect(8, -64, 4, 3);                        // angry eyes
    ctx.fillStyle = '#a02020';
    ctx.fillRect(5, -55, 8, 2);
    ctx.fillStyle = sk;                                                            // arms
    if (o.arms === 'press') {
        ctx.fillRect(10, -54, 34, 12);
    } else if (o.arms === 'slap') {
        ctx.fillRect(10, -58, 40, 10);
        ctx.fillRect(10, -44, 40, 10);
    } else {
        ctx.fillRect(24, -48, 10, 22);
        ctx.fillRect(-34, -48, 10, 22);
    }
}

// Condor: origin = center, faces right. fl = wing flap (-1..1)
function drawCondorSprite(e, o) {
    const fl = o.fl;
    ctx.save();                                   // far wing
    ctx.translate(-6, -4);
    ctx.fillStyle = fcol(e, '#5a4128');
    ctx.beginPath();
    ctx.moveTo(6, -2); ctx.lineTo(-26, -6 - fl * 20); ctx.lineTo(-36, -2 - fl * 16);
    ctx.lineTo(-28, 4 - fl * 10); ctx.lineTo(-12, 6);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.fillStyle = fcol(e, '#241709');           // tail
    ctx.fillRect(-30, -2, 12, 5);
    ctx.fillStyle = fcol(e, '#3b2a1a');           // body
    ctx.beginPath(); ctx.ellipse(0, 0, 22, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = fcol(e, '#f0eada');           // neck ruff
    ctx.beginPath(); ctx.ellipse(14, -2, 7, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = fcol(e, '#d98c8c');           // bald head
    ctx.beginPath(); ctx.arc(22, -5, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e6b800';                    // hooked beak
    ctx.beginPath(); ctx.moveTo(27, -7); ctx.lineTo(37, -3); ctx.lineTo(34, 0); ctx.lineTo(27, -2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = o.warn ? '#ff0000' : '#000000';
    ctx.fillRect(23, -8, 2, 2);                   // eye
    ctx.fillStyle = fcol(e, '#241709');           // near wing
    ctx.beginPath();
    ctx.moveTo(6, -2); ctx.lineTo(-26, -6 - fl * 20); ctx.lineTo(-36, -2 - fl * 16);
    ctx.lineTo(-28, 4 - fl * 10); ctx.lineTo(-12, 6);
    ctx.closePath(); ctx.fill();
}

// Gang rat: origin = center-bottom, faces right, base size 38 x 30
function drawRatSprite(e, o) {
    const fur = fcol(e, o.fur || '#8a8a95');
    const s = Math.sin(o.walk || 0);
    ctx.fillStyle = '#1a1a1a';                    // legs
    ctx.fillRect(-10 + Math.round(s * 4), -8, 7, 8);
    ctx.fillRect(2 - Math.round(s * 4), -8, 7, 8);
    ctx.strokeStyle = fcol(e, '#c58a8a');         // tail
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-14, -12); ctx.quadraticCurveTo(-30, -6, -30, -20 + Math.round(s * 3)); ctx.stroke();
    ctx.fillStyle = fcol(e, o.suit || '#222222'); // suit
    ctx.fillRect(-14, -24, 26, 18);
    ctx.fillStyle = '#bb2222';
    ctx.fillRect(8, -22, 3, 9);                   // tie
    ctx.fillStyle = fur;                          // head
    ctx.beginPath(); ctx.ellipse(14, -24, 9, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(20, -27); ctx.lineTo(32, -22); ctx.lineTo(20, -18); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(9, -30, 4, 0, Math.PI * 2); ctx.fill();   // ear
    ctx.fillStyle = '#e9a0b0';
    ctx.beginPath(); ctx.arc(9, -30, 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(30, -24, 3, 3);                  // nose
    ctx.fillStyle = '#ffee00';
    ctx.fillRect(17, -28, 3, 3);                  // eye
    ctx.fillStyle = '#000';
    ctx.fillRect(19, -27, 1, 2);
    ctx.fillStyle = fcol(e, o.hat || '#111111');  // fedora
    ctx.fillRect(3, -33, 22, 3);
    ctx.fillRect(7, -40, 14, 8);
    ctx.fillStyle = '#bb2222';
    ctx.fillRect(7, -35, 14, 2);
    ctx.fillStyle = '#222';                       // arm & gun
    if (o.aim) {
        ctx.fillRect(10, -20, 18, 5);
        ctx.fillStyle = '#666';
        ctx.fillRect(26, -21, 10, 4);
    } else {
        ctx.fillRect(6, -20, 6, 10);
    }
    if (o.muzzle) {
        ctx.fillStyle = '#ffee66';
        ctx.fillRect(36, -25, 10, 8);
    }
}

// ====================== Stage 3 enemy: flying sumo wrestler ======================
class Sumo {
    constructor(x) {
        this.kind = 'sumo';
        this.x = x;
        this.y = FLOOR_Y;
        this.width = 56;
        this.height = 70;
        this.hp = 6; this.maxHp = 6;
        this.points = 500;
        this.state = 'ground';
        this.timer = 1;          // leaps right away
        this.vx = 0; this.vy = 0;
        this.facing = 1;
        this.hitDone = false;
        this.flash = 0; this.t = 0; this.ring = 0;
        this.lastHitId = null;
        this.active = true;
    }

    update() {
        if (!this.active) return;
        this.t++;
        if (this.flash > 0) this.flash--;
        if (this.ring > 0) this.ring--;
        const cx = this.x + this.width / 2;
        const pcx = player.x + player.width / 2;

        if (this.state === 'ground') {          // stomping (shiko) before the next flight
            this.facing = pcx > cx ? 1 : -1;
            if (--this.timer <= 0) this.leap(pcx - cx);
        } else {                                // flying belly-press
            this.vy += 0.5;
            this.x += this.vx;
            this.y += this.vy;
            if (!this.hitDone && player.hurtTimer <= 0 &&
                playerTouches(this.x, this.x + this.width, this.y - this.height, this.y)) {
                this.hitDone = true;
                hurtPlayer(14, cx);
            }
            if (this.y >= FLOOR_Y && this.vy > 0) {
                this.y = FLOOR_Y; this.vy = 0; this.vx = 0;
                this.state = 'ground'; this.timer = 55; this.ring = 18;
                audio.slam();
                const lx = this.x + this.width / 2;
                if (player.isGrounded && player.hurtTimer <= 0 && Math.abs(pcx - lx) < 70) hurtPlayer(10, lx);
            }
        }
    }

    leap(dx) {
        const T = 50;
        this.vy = -0.5 * T / 2;
        this.vx = Math.max(-9, Math.min(9, dx / T));
        this.state = 'air';
        this.hitDone = false;
        audio.leap();
    }

    draw() {
        if (!this.active) return;
        const air = this.state === 'air';
        ctx.save();
        ctx.translate(this.x - cameraX + this.width / 2, this.y);
        if (this.ring > 0) {
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(0, -2, (18 - this.ring) * 5 + 10, (18 - this.ring) * 1.2 + 2, 0, 0, Math.PI * 2);
            ctx.stroke();
        }
        ctx.scale(this.facing, 1);
        if (air) {
            ctx.translate(0, -this.height / 2);
            ctx.rotate(0.35);
            ctx.translate(0, this.height / 2);
        }
        const sw = Math.sin(this.t * 0.35);
        drawSumoSprite(this, {
            lift: air ? 0 : Math.round(Math.max(0, sw) * 10),
            lift2: air ? 0 : Math.round(Math.max(0, -sw) * 10),
            arms: air ? 'press' : 'side'
        });
        ctx.restore();
    }
}

// ====================== Stage 4 enemy: diving condor ======================
class Condor {
    constructor(x) {
        this.kind = 'condor';
        this.x = x;
        this.baseY = 150;
        this.y = this.baseY;        // bottom
        this.width = 56;
        this.height = 34;
        this.hp = 3; this.maxHp = 3;
        this.points = 400;
        this.state = 'hover';
        this.timer = 100 + Math.random() * 60;
        this.vx = 0; this.vy = 0;
        this.facing = 1;
        this.hitDone = false;
        this.flash = 0; this.flap = Math.random() * 6;
        this.lastHitId = null;
        this.active = true;
    }

    update() {
        if (!this.active) return;
        if (this.flash > 0) this.flash--;
        this.flap += this.state === 'dive' ? 0.1 : 0.4;
        const cx = this.x + this.width / 2, cy = this.y - this.height / 2;
        const pcx = player.x + player.width / 2, pcy = player.y - player.height / 2;

        if (this.state === 'hover') {            // circle above the player
            this.vx = Math.max(-3.2, Math.min(3.2, (pcx - cx) * 0.05));
            this.x += this.vx;
            this.y = this.baseY + Math.sin(this.flap * 0.5) * 8;
            if (Math.abs(this.vx) > 0.2) this.facing = this.vx > 0 ? 1 : -1;
            if (--this.timer <= 0) { this.state = 'warn'; this.timer = 32; audio.screech(); }
        } else if (this.state === 'warn') {      // screech, then lock the target
            this.facing = pcx > cx ? 1 : -1;
            this.y -= 0.6;
            if (--this.timer <= 0) {
                const dx = pcx - cx, dy = pcy - cy, len = Math.hypot(dx, dy) || 1;
                this.vx = dx / len * 9.5;
                this.vy = dy / len * 9.5;
                this.facing = this.vx >= 0 ? 1 : -1;
                this.state = 'dive';
                this.hitDone = false;
            }
        } else if (this.state === 'dive') {      // straight dive: sidestep it!
            this.x += this.vx;
            this.y += this.vy;
            if (!this.hitDone && player.hurtTimer <= 0 &&
                playerTouches(this.x, this.x + this.width, this.y - this.height, this.y)) {
                this.hitDone = true;
                hurtPlayer(14, cx);
            }
            if (this.y >= FLOOR_Y - 4 || this.x < cameraX - 150 || this.x > cameraX + CANVAS_WIDTH + 150) {
                this.state = 'rise';
                this.vy = -5;
                this.vx = (this.vx >= 0 ? 1 : -1) * 4;
            }
        } else if (this.state === 'rise') {
            this.x += this.vx;
            this.y += this.vy;
            if (this.y <= this.baseY) {
                this.y = this.baseY;
                this.state = 'hover';
                this.timer = 100 + Math.random() * 60;
            }
        }
    }

    draw() {
        if (!this.active) return;
        ctx.save();
        ctx.translate(this.x - cameraX + this.width / 2, this.y - this.height / 2);
        ctx.scale(this.facing, 1);
        if (this.state === 'dive') ctx.rotate(Math.atan2(this.vy, Math.abs(this.vx)) * 0.8);
        const diving = this.state === 'dive' || this.state === 'rise';
        drawCondorSprite(this, { fl: diving ? -0.6 : Math.sin(this.flap), warn: this.state === 'warn' });
        ctx.restore();
        if (this.state === 'warn') {
            ctx.fillStyle = '#ff0000';
            ctx.font = 'bold 24px "Courier New"';
            ctx.fillText('!', this.x - cameraX + this.width / 2 - 6, this.y - this.height - 6);
        }
    }
}

// ====================== Stage 5 enemy: gang rat (hit it while crouching!) ======================
class GangRat {
    constructor(x) {
        this.kind = 'rat';
        this.x = x;
        this.y = FLOOR_Y;
        this.width = 38;
        this.height = 30;
        this.hp = 3; this.maxHp = 3;
        this.points = 300;
        this.crouchOnly = true;
        this.state = 'walk';
        this.timer = 0;
        this.cooldown = 60 + Math.random() * 60;
        this.biteCd = 0;
        this.facing = 1;
        this.walkTime = Math.random() * 6;
        this.flash = 0; this.muzzle = 0;
        this.lastHitId = null;
        this.active = true;
    }

    fire() {
        bullets.push(new Bullet(this.x + this.width / 2 + this.facing * 24, FLOOR_Y - 16, this.facing * 6.5, 0, 'bullet'));
        this.muzzle = 5;
        audio.gun();
    }

    update() {
        if (!this.active) return;
        if (this.flash > 0) this.flash--;
        if (this.muzzle > 0) this.muzzle--;
        if (this.biteCd > 0) this.biteCd--;
        if (this.cooldown > 0) this.cooldown--;
        const cx = this.x + this.width / 2;
        const pcx = player.x + player.width / 2;
        const dist = Math.abs(pcx - cx);
        this.facing = pcx > cx ? 1 : -1;

        if (this.state === 'aim') {              // stop and shoot low
            if (--this.timer === 8) this.fire();
            if (this.timer <= 0) { this.state = 'walk'; this.cooldown = 140; }
            return;
        }
        if (dist > 40) {
            this.x += this.facing * 2.1;
            this.walkTime += 0.5;
        }
        if (this.cooldown <= 0 && dist > 110 && dist < 360) {
            this.state = 'aim';
            this.timer = 26;
        }
        if (dist < 40 && this.biteCd <= 0 && player.hurtTimer <= 0 && player.y >= FLOOR_Y - 25) {
            hurtPlayer(6, cx);
            this.biteCd = 70;
        }
    }

    draw() {
        if (!this.active) return;
        ctx.save();
        ctx.translate(this.x - cameraX + this.width / 2, this.y);
        ctx.scale(this.facing, 1);
        drawRatSprite(this, { walk: this.walkTime, aim: this.state === 'aim', muzzle: this.muzzle > 0 });
        ctx.restore();
        if (this.state === 'aim') {
            ctx.fillStyle = '#ff0000';
            ctx.font = 'bold 18px "Courier New"';
            ctx.fillText('!', this.x - cameraX + this.width / 2 - 4, this.y - 44);
        }
    }
}
